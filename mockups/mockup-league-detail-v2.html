<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHL'94 Online — Leagues</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1E192A;--surface:#2A2339;--sd:#211D28;--deep:#0B0910;--hover:#352E43;
  --bd:rgba(117,105,142,.28);--bdm:rgba(117,105,142,.50);
  --t:#fff;--ts:rgba(255,255,255,.80);--tm:rgba(255,255,255,.50);--td:rgba(255,255,255,.30);
  --gr:#82D34A;--grd:#4C8922;
  --wb:rgba(130,211,74,.12);--lb:rgba(255,80,80,.10);--lt:#FF6B6B;
  --fh:'NHLCA',Impact,'Arial Narrow',Arial,sans-serif;--fb:'Roboto',sans-serif;
}
body{font-family:var(--fb);background:var(--bg);color:var(--t);min-height:100vh;-webkit-font-smoothing:antialiased}

/* NAV */
nav{background:linear-gradient(to bottom,#15111E,#2A2339);border-bottom:1px solid var(--bd);height:54px;display:flex;align-items:center;padding:0 24px;gap:24px;position:sticky;top:0;z-index:200}
.logo{font-family:var(--fh);font-size:20px;color:var(--t);letter-spacing:.04em;white-space:nowrap;flex-shrink:0}
.logo em{color:var(--gr);font-style:normal}
.logo small{font-family:var(--fb);font-size:12px;color:var(--td);font-weight:400;margin-left:4px}
.nav-links{display:flex;gap:2px}
.na{padding:6px 11px;border-radius:6px;font-size:13px;font-weight:600;color:var(--tm);text-decoration:none;position:relative;transition:color .12s,background .12s}
.na:hover{color:var(--ts);background:rgba(255,255,255,.04)}
.na.on{color:var(--t)}
.na.on::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gr)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav-av{width:28px;height:28px;border-radius:50%;background:var(--surface);border:1.5px solid var(--bdm);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--tm);cursor:pointer}

/* PAGE */
.pw{max-width:1160px;margin:0 auto;padding:28px 32px 0}

/* LEAGUE HEADER */
.lhdr{margin-bottom:0}
.ltitle-wrap{position:relative;display:inline-block;margin-bottom:8px}
.ltitle-btn{display:flex;align-items:center;gap:9px;background:transparent;border:none;cursor:pointer;padding:0}
.ltitle-btn:hover .ltitle{color:var(--ts)}
.ltitle{font-family:var(--fh);font-size:34px;font-weight:400;line-height:1;letter-spacing:.02em;color:var(--t);transition:color .12s}
.lchev{color:var(--tm);flex-shrink:0;transition:transform .2s}
.ltitle-btn.open .lchev{transform:rotate(180deg)}

/* League dropdown */
.ldd{display:none;position:absolute;top:calc(100% + 8px);left:0;background:var(--deep);border:1px solid var(--bdm);border-radius:10px;min-width:300px;z-index:400;box-shadow:0 16px 40px rgba(0,0,0,.65);overflow:hidden}
.ldd.open{display:block}
.ldd-scroll{max-height:calc(5 * 54px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.ldd-item{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid rgba(117,105,142,.1);transition:background .12s}
.ldd-item:last-child{border-bottom:none}
.ldd-item:hover{background:var(--hover)}
.ldd-item.sel{background:rgba(130,211,74,.05)}
.ldi-name{font-size:14px;font-weight:700;color:var(--ts);flex:1}
.ldd-item.sel .ldi-name{color:var(--gr)}
.ldi-badges{display:flex;gap:4px}

/* Badges */
.badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:3px}
.b-classic   {background:rgba(130,211,74,.12); color:#82D34A; border:1px solid rgba(130,211,74,.25)}
.b-custom    {background:rgba(96,165,250,.12);  color:#60A5FA; border:1px solid rgba(96,165,250,.25)}
.b-franchise {background:rgba(45,212,191,.12);  color:#2DD4BF; border:1px solid rgba(45,212,191,.25)}
.b-tournament{background:rgba(252,211,77,.12);  color:#FCD34D; border:1px solid rgba(252,211,77,.25)}
.b-gens      {background:rgba(192,132,252,.12); color:#C084FC; border:1px solid rgba(192,132,252,.25)}
.b-snes      {background:rgba(251,146,60,.12);  color:#FB923C; border:1px solid rgba(251,146,60,.25)}

/* Meta row */
.lmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.coach-ct{font-size:12px;color:var(--tm);margin-left:2px}
.coach-ct strong{color:var(--ts);font-weight:700}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-top:18px}
.tb{padding:11px 18px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tm);background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-family:var(--fb);transition:color .12s}
.tb:hover{color:var(--ts)}
.tb.on{color:var(--t);border-bottom-color:var(--gr)}

/* CONF PILLS */
.conf-row{padding:14px 0 12px;display:flex;gap:6px}
.cp{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--tm);font-family:var(--fb);transition:all .12s}
.cp:hover{border-color:var(--bdm);color:var(--ts)}
.cp.on{background:var(--wb);border-color:rgba(130,211,74,.35);color:var(--gr)}

/* PANES */
.pane{display:none}.pane.on{display:block}

/* STANDINGS */
.stbl{width:100%;border-collapse:collapse;margin-bottom:48px}
.stbl thead th{padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--td);text-align:left;border-bottom:1px solid var(--bd)}
.stbl thead th.r{text-align:right}
.stbl tbody td{padding:11px 12px;font-size:13px;color:var(--ts);border-bottom:1px solid rgba(117,105,142,.1)}
.stbl tbody td.r{text-align:right;font-variant-numeric:tabular-nums}
.stbl tbody tr:nth-child(even){background:var(--surface)}
.stbl tbody tr:hover{background:var(--hover)}
.stbl tbody tr:last-child td{border-bottom:none}
.stbl tbody tr.co td{border-top:1px dashed rgba(255,80,80,.22)!important}
.tdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.tname{font-weight:700;font-size:13px;color:var(--t);letter-spacing:.03em}
.tcoach{font-size:11px;color:var(--td)}
.rank{color:var(--td);font-size:11px;font-weight:700}
.pts{font-weight:900;font-size:15px;color:var(--t)}
.dp{color:#82D34A;font-weight:700}.dn{color:#FF6B6B;font-weight:700}
.td-t{display:flex;align-items:center;gap:8px}

/* TEAM BANNER */
.banner{border-left:3px solid var(--tc,var(--gr));background:var(--sd);border:1px solid var(--bd);border-left:3px solid var(--tc,var(--gr));border-radius:0 8px 8px 0;padding:16px 20px;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:18px;margin-bottom:10px}
.b-logo{width:58px;height:58px;border-radius:50%;background:var(--tc,#005F9E);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:15px;color:#fff;letter-spacing:.04em;flex-shrink:0;opacity:.92}
.b-info{}
.cdw{position:relative;display:inline-block}
.cdb{display:flex;align-items:center;gap:7px;background:transparent;border:none;cursor:pointer;padding:0;font-family:var(--fb)}
.cdb:hover .cdn{color:var(--ts)}
.cdn{font-size:18px;font-weight:700;color:var(--t);letter-spacing:-.01em;transition:color .12s}
.cdc{color:var(--tm);flex-shrink:0;transition:transform .2s}
.cdb.open .cdc{transform:rotate(180deg)}
.brec{font-size:12px;color:var(--tm);margin-top:4px}
.bstats{display:flex;gap:22px}
.bst{text-align:right}
.bsv{font-size:20px;font-weight:900;color:var(--t);font-variant-numeric:tabular-nums;line-height:1}
.bsl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--td);margin-top:3px}

/* Coach dropdown */
.cdd{display:none;position:absolute;top:calc(100% + 6px);left:0;background:var(--deep);border:1px solid var(--bdm);border-radius:8px;min-width:220px;z-index:400;box-shadow:0 12px 32px rgba(0,0,0,.6);overflow:hidden}
.cdd.open{display:block}
.cdd-scroll{max-height:calc(5 * 44px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.cdi{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;color:var(--ts);border-bottom:1px solid rgba(117,105,142,.1);transition:background .12s,color .12s}
.cdi:last-child{border-bottom:none}
.cdi:hover{background:var(--hover);color:var(--t)}
.cdi.sel{color:var(--gr);font-weight:700}
.cdi-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cdi-team{font-size:10px;color:var(--td);margin-left:auto;font-variant-numeric:tabular-nums}

/* Form dots */
.form-row{display:flex;align-items:center;gap:5px;padding:2px 0 14px;padding-left:82px}
.fd{width:10px;height:10px;border-radius:50%}
.fd-w{background:var(--gr);opacity:.9}
.fd-l{background:#FF6B6B;opacity:.85}
.fd-t{background:rgba(255,255,255,.3)}
.fd-p{background:rgba(255,255,255,.08);border:1px solid var(--bd)}
.flbl{font-size:9px;color:var(--td);margin-left:6px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}

/* SUB-TABS */
.stabs{display:flex;gap:6px;margin-bottom:20px}
.stab{padding:5px 15px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--tm);font-family:var(--fb);transition:all .12s}
.stab:hover{border-color:var(--bdm);color:var(--ts)}
.stab.on{background:rgba(255,255,255,.07);border-color:var(--bdm);color:var(--t)}

/* SCHEDULE GRID */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:48px}
.ocol{background:var(--sd);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.ohdr{padding:11px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.oname{font-size:13px;font-weight:700;color:var(--t)}
.orec{font-size:10px;font-weight:700;color:var(--tm);margin-left:auto;display:flex;gap:4px}
.orec .w{color:var(--gr)}
.gc{padding:10px 12px;border-bottom:1px solid rgba(117,105,142,.08);border-left:2px solid transparent;display:grid;grid-template-columns:1fr 52px 1fr;align-items:center;gap:4px;cursor:pointer;transition:background .1s}
.gc:last-child{border-bottom:none}
.gc:hover{background:var(--hover)}
.gc.gw{border-left-color:rgba(130,211,74,.6);background:rgba(130,211,74,.03)}
.gc.gw:hover{background:rgba(130,211,74,.07)}
.gc.gl{border-left-color:rgba(255,80,80,.4);background:rgba(255,80,80,.02)}
.gc.gl:hover{background:rgba(255,80,80,.05)}
.gc.gp{opacity:.55}
.gct{font-size:11px;font-weight:600;color:var(--ts);display:flex;align-items:center;gap:5px}
.gct.h{flex-direction:row-reverse;text-align:right}
.gsb{text-align:center}
.gsc{font-size:14px;font-weight:900;color:var(--t);font-variant-numeric:tabular-nums}
.gsep{color:var(--td)}
.gvs{font-size:11px;font-weight:700;color:var(--td)}
.gd{font-size:9px;color:var(--td);text-align:center;margin-top:1px}
.gres{font-size:8px;font-weight:900;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gres.w{background:var(--wb);color:var(--gr)}
.gres.l{background:var(--lb);color:#FF6B6B}
.gres.t{background:rgba(255,255,255,.07);color:var(--tm)}

/* ROSTER ACCORDION */
.acc{margin-bottom:2px}
.ahdr{display:flex;align-items:center;gap:8px;padding:13px 16px;background:var(--sd);border:1px solid var(--bd);border-radius:7px;cursor:pointer;transition:background .12s;user-select:none}
.ahdr:hover{background:var(--hover)}
.ahdr.open{border-radius:7px 7px 0 0;border-bottom-color:var(--sd)}
.atitle{font-size:13px;font-weight:700;color:var(--t)}
.acount{font-size:11px;color:var(--tm)}
.achev{margin-left:auto;color:var(--td);transition:transform .2s}
.ahdr.open .achev{transform:rotate(180deg)}
.abody{display:none;background:var(--sd);border:1px solid var(--bd);border-top:none;border-radius:0 0 7px 7px;overflow:hidden}
.abody.open{display:block}
.rp{display:grid;grid-template-columns:32px 1fr 52px 46px;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid rgba(117,105,142,.08);font-size:13px;cursor:pointer;transition:background .1s}
.rp:last-child{border-bottom:none}
.rp:hover{background:var(--hover)}
.rp:nth-child(even){background:var(--surface)}
.rp:nth-child(even):hover{background:var(--hover)}
.rpn{font-size:11px;color:var(--td);text-align:right;font-variant-numeric:tabular-nums}
.rpname{font-weight:600;color:var(--t)}
.rppos{font-size:11px;color:var(--tm);text-align:center}
.rprat{font-size:12px;font-weight:700;color:var(--gr);text-align:right}

/* PLAYOFFS */
.bracket{display:flex;gap:0;min-width:640px}
.brd{flex:1;border-right:1px solid var(--bd)}
.brd:last-child{border-right:none}
.brhdr{padding:9px 8px;text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--td);border-bottom:1px solid var(--bd);background:var(--sd)}
.bms{display:flex;flex-direction:column;justify-content:space-around;padding:12px 8px;gap:10px;min-height:180px}
.bm{border-radius:7px;border:1px solid var(--bd);overflow:hidden;background:var(--sd)}
.bmt{display:flex;align-items:center;gap:7px;padding:9px 10px;font-size:12px;font-weight:600;border-bottom:1px solid var(--bd);color:var(--ts);transition:background .1s}
.bmt:last-of-type{border-bottom:none}
.bmt.win{background:rgba(130,211,74,.06);color:var(--t)}
.bmt.out{opacity:.3}
.bseed{font-size:9px;color:var(--td);width:12px;font-weight:400;flex-shrink:0}
.bw{margin-left:auto;font-size:17px;font-weight:900;color:var(--tm)}
.bw.lead{color:var(--gr)}
.bstat{padding:4px 8px;text-align:center;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--td);background:var(--surface)}
.bstat.done{color:var(--gr)}
.bstat.live{color:#FF6B6B}

/* FOOTER */
footer{margin-top:60px;padding:28px 0 40px;border-top:1px solid var(--bd)}
.fi{max-width:1160px;margin:0 auto;padding:0 32px;display:flex;align-items:flex-start;gap:40px}
.flogo{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--bdm);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--fh);font-size:11px;color:var(--td);text-align:center;line-height:1.2;letter-spacing:.04em}
.fcols{display:flex;gap:40px;flex:1}
.fl{display:block;font-size:12px;color:var(--tm);text-decoration:none;margin-bottom:9px;transition:color .12s}
.fl:hover{color:var(--ts)}
.fsoc{margin-left:auto;display:flex;gap:14px;align-items:center;padding-top:2px}
.si{color:var(--tm);cursor:pointer;transition:color .12s}
.si:hover{color:var(--ts)}

/* Util */
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.bracket-scroll{overflow-x:auto;padding-bottom:12px}
</style>
</head>
<body>

<nav>
  <div class="logo">NHL<em>'94</em> <small>ONLINE</small></div>
  <div class="nav-links">
    <a href="#" class="na">Home</a>
    <a href="#" class="na on">Leagues</a>
    <a href="#" class="na">Draft</a>
    <a href="#" class="na">Game Info</a>
    <a href="#" class="na">Stats</a>
  </div>
  <div class="nav-r"><div class="nav-av">GM</div></div>
</nav>

<div class="pw">

  <!-- LEAGUE HEADER -->
  <div class="lhdr">
    <div class="ltitle-wrap">
      <button class="ltitle-btn" id="ltbtn" onclick="toggleLdd()">
        <span class="ltitle" id="ltitle-text">NHL '94 Classic S12</span>
        <svg class="lchev" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="ldd" id="ldd">
        <div class="ldd-scroll" id="ldd-scroll"></div>
      </div>
    </div>
    <div class="lmeta" id="lmeta"></div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tb on" onclick="setTab('standings')">Standings</button>
    <button class="tb" onclick="setTab('schedule')">Schedule</button>
    <button class="tb" onclick="setTab('rosters')">Rosters</button>
    <button class="tb" onclick="setTab('playoffs')">Playoffs</button>
  </div>

  <!-- CONF PILLS -->
  <div class="conf-row" id="conf-row"></div>

  <!-- STANDINGS -->
  <div class="pane on" id="pane-standings">
    <table class="stbl" id="stbl">
      <thead><tr>
        <th style="width:28px">#</th><th>Team</th><th>Coach</th>
        <th class="r">GP</th><th class="r">W</th><th class="r">L</th><th class="r">T</th>
        <th class="r">PTS</th><th class="r">GF</th><th class="r">GA</th><th class="r">DIFF</th>
      </tr></thead>
      <tbody id="stbl-body"></tbody>
    </table>
  </div>

  <!-- SCHEDULE -->
  <div class="pane" id="pane-schedule">
    <div class="banner" id="sched-banner"></div>
    <div class="form-row" id="sched-form"></div>
    <div class="stabs">
      <button class="stab on" onclick="setSubTab('schedule','regular',this)">Regular Season</button>
      <button class="stab" onclick="setSubTab('schedule','playoffs',this)">Playoffs</button>
    </div>
    <div class="sgrid" id="sched-grid"></div>
  </div>

  <!-- ROSTERS -->
  <div class="pane" id="pane-rosters">
    <div class="banner" id="roster-banner"></div>
    <div class="form-row" id="roster-form"></div>
    <div class="stabs">
      <button class="stab on" onclick="setSubTab('rosters','regular',this)">Regular Season</button>
      <button class="stab" onclick="setSubTab('rosters','playoffs',this)">Playoffs</button>
    </div>
    <div class="roster-sections" id="roster-acc"></div>
  </div>

  <!-- PLAYOFFS -->
  <div class="pane" id="pane-playoffs">
    <div class="bracket-scroll"><div class="bracket" id="bracket"></div></div>
  </div>

</div>

<footer>
  <div class="fi">
    <div class="flogo">NHL<br>'94</div>
    <div class="fcols">
      <div>
        <a href="#" class="fl">Leagues</a>
        <a href="#" class="fl">Downloads</a>
        <a href="#" class="fl">Getting Started</a>
      </div>
      <div>
        <a href="#" class="fl">Rules &amp; Policies</a>
        <a href="#" class="fl">About</a>
      </div>
    </div>
    <div class="fsoc">
      <span class="si"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg></span>
      <span class="si"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></span>
    </div>
  </div>
</footer>

<script>
// ── DATA ──────────────────────────────────────────────────────────────
const LEAGUES = [

function badgeHtml(l) {
  return BADGE_HTML[l.type] + BADGE_HTML[l.mode] + BADGE_HTML[l.rom];
}

function renderLdd() {
  document.getElementById('ldd-scroll').innerHTML = LEAGUES.map((l,i) =>

       <span class="ldi-name${i===S.league?' ':''}${i===S.league?'sel-name':''}" style="${i===S.league?'color:var(--gr)':''}">${l.name}</span>
       <span class="ldi-badges">${badgeHtml(l)}</span>

  ).join('');
}

function renderLmeta() {
  const l = LEAGUES[S.league];

    badgeHtml(l) +

}

function renderConfPills() {

}

function renderStandings() {
  const rows = STANDINGS[S.conf];
  document.getElementById('stbl-body').innerHTML = rows.map(r => {
    const d = r.gf - r.ga;
    return `<tr${r.co?' class="co"':''}>
      <td class="rank">${r.rank}</td>
      <td><div class="td-t"><span class="tdot" style="background:${r.color}"></span>
        <div><div class="tname">${r.team}</div></div></div></td>
      <td class="tcoach">${r.coach}</td>
      <td class="r">${r.gp}</td><td class="r">${r.w}</td><td class="r">${r.l}</td><td class="r">${r.t}</td>
      <td class="r pts">${r.pts}</td>
      <td class="r">${r.gf}</td><td class="r">${r.ga}</td>
      <td class="r ${d>0?'dp':d<0?'dn':''}">${d>0?'+':''}${d}</td>
    </tr>`;
  }).join('');
}

function getCoach() {
  const list = COACHES[S.conf];
  if (!list.find(c => c.u === S.coach)) S.coach = list[0].u;
  return list.find(c => c.u === S.coach);
}

function renderSchedGrid() {
  const c = getCoach();
  const data = SCHEDULE[c.u] || DEFAULT_SCHEDULE(S.conf);
  document.getElementById('sched-grid').innerHTML = data.map(og => {
    const recHtml = `<span class="orec"><span class="w">${og.w}W</span> ${og.l}L${og.t?' '+og.t+'T':''}</span>`;
    const games = og.games.map(g => {
      const pending = g.r==='p';
      const cl = pending ? 'gp' : g.r==='w' ? 'gw' : g.r==='l' ? 'gl' : '';
      const score = pending
        ? `<div class="gsb"><div class="gvs">vs</div><div class="gd">${g.d}</div></div>`
        : `<div class="gsb"><div class="gsc">${g.as}<span class="gsep">–</span>${g.hs}</div><div class="gd">${g.d}</div></div>`;
      const res = pending ? '' : `<div class="gres ${g.r}">${g.r.toUpperCase()}</div>`;
      return `<div class="gc ${cl}">
        <div class="gct">${g.a}</div>
        ${score}
        <div class="gct h">${g.h}${res}</div>
      </div>`;
    }).join('');
    return `<div class="ocol">
      <div class="ohdr">
        <span class="tdot" style="background:${og.color}"></span>
        <span class="oname">${og.opp}</span>
        ${recHtml}
      </div>${games}
    </div>`;
  }).join('');
}

function toggleLdd() {
  const dd = document.getElementById('ldd');
  const btn = document.getElementById('ltbtn');
  const open = dd.classList.toggle('open');
  btn.classList.toggle('open', open);
  if (open) renderLdd();
}

function setLeague(i) {
  S.league = i;
  document.getElementById('ltitle-text').textContent = LEAGUES[i].name;
  renderLmeta();
  renderLdd();
  document.getElementById('ldd').classList.remove('open');
  document.getElementById('ltbtn').classList.remove('open');
}

function setConf(c) {
  S.conf = c;
  // reset coach to first alphabetically in new conf
  S.coach = COACHES[c][0].u;
  renderConfPills();
  renderStandings();
  if (S.tab === 'schedule' || S.tab === 'rosters') {
    renderBannerAndContent();
  }
}

function setTab(t) {
  S.tab = t;
  document.querySelectorAll('.tb').forEach(b =>
    b.classList.toggle('on', b.textContent.trim().toLowerCase() === t.toLowerCase() ||
      (t==='rosters' && b.textContent.trim().toLowerCase()==='rosters'))
  );
  // match by onclick
  document.querySelectorAll('.tb').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.tb').forEach(b => {
    if (b.getAttribute('onclick') === `setTab('${t}')`) b.classList.add('on');
  });
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  document.getElementById('pane-'+t).classList.add('on');
  if (t === 'schedule' || t === 'rosters') renderBannerAndContent();
  if (t === 'playoffs') renderPlayoffs();
}

function renderBannerAndContent() {
  renderBanner('schedule');
  renderForm('sched-form');
  renderSchedGrid();
  renderBanner('rosters');
  renderForm('roster-form');
  renderRoster();
}

function setCoach(u, ddId) {
  S.coach = u;
  document.getElementById(ddId).classList.remove('open');
  ['schedule','rosters'].forEach(p => {
    const btnId = p+'-coach-btn';
    const btn = document.getElementById(btnId);
    if (btn) btn.classList.remove('open');
  });
  renderBannerAndContent();
}

function toggleCdd(ddId, btnId) {
  // close all other dropdowns
  document.querySelectorAll('.cdd').forEach(d => { if (d.id!==ddId) d.classList.remove('open'); });
  document.querySelectorAll('.cdb').forEach(b => { if (b.id!==btnId) b.classList.remove('open'); });
  const dd = document.getElementById(ddId);
  const btn = document.getElementById(btnId);
  const open = dd.classList.toggle('open');
  btn.classList.toggle('open', open);
}

function setSubTab(panel, val, el) {
  el.closest('.stabs').querySelectorAll('.stab').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
}

function toggleAcc(hdr) {
  const body = hdr.nextElementSibling;
  hdr.classList.toggle('open');
  body.classList.toggle('open');
}

// close dropdowns on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.ltitle-wrap')) {
    document.getElementById('ldd').classList.remove('open');
    document.getElementById('ltbtn').classList.remove('open');
  }
  if (!e.target.closest('.cdw')) {
    document.querySelectorAll('.cdd').forEach(d => d.classList.remove('open'));
    document.querySelectorAll('.cdb').forEach(b => b.classList.remove('open'));
  }
});

// ── INIT ─────────────────────────────────────────────────────────────
renderLmeta();
renderConfPills();
renderStandings();
renderBannerAndContent();
</script>
</body>
</html>
