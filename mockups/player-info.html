<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Attributes — NHL '94</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --p1: #75698E;  --p2: #2A2339;  --p3: #1E192A;  --p4: #211D28;  --p5: #0B0910;
      --gray1: #717171;  --gray2: #554B4B;
      --gn1: #82D34A;    --gn2: #4C8922;
      --y1:  #D89D27;    --y2:  #815E18;
      --o1:  #E4641B;    --o2:  #96471D;
      --r1:  #C63939;    --r2:  #8B2828;
      --pk1: #C63984;    --pk2: #8B285D;
      --bl1: #3380CC;    --bl2: #23598F;
      --font-h: Impact, 'Arial Narrow', Arial, sans-serif;
      --font-b: 'Roboto', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-b);
      background: var(--p2);
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(130,211,74,0.05) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(51,128,204,0.03) 0%, transparent 60%);
      color: white;
      min-height: 100vh;
    }

    /* ── Page wrapper ─────────────────────────────────── */
    .page { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Page header ──────────────────────────────────── */
    .page-header {
      padding: 40px 64px 0;
      margin-bottom: 28px;
    }
    .page-title  { font-family: var(--font-b); font-size: clamp(22px, 3vw, 36px); color: white; line-height: 1; margin-bottom: 8px; font-weight: 400; }
    .page-sub    { font-size: 16px; color: var(--p1); display: flex; align-items: center; gap: 10px; }
    .badge-placeholder {
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--y1);
      background: rgba(255,200,50,0.1);
      border: 1px solid rgba(255,200,50,0.25);
      border-radius: 4px; padding: 3px 7px; white-space: nowrap;
    }

    /* View mode toggle */
    .view-toggle {
      display: flex; gap: 4px;
      background: var(--p3);
      border: 1px solid rgba(117,105,142,0.25);
      border-radius: 8px; padding: 4px;
      margin-left: auto;
    }
    .view-btn {
      padding: 5px 12px; border-radius: 5px; border: none; cursor: pointer;
      font-family: var(--font-b); font-size: 12px; font-weight: 600;
      transition: background 0.15s, color 0.15s;
      background: transparent; color: var(--p1);
    }
    .view-btn.active { background: var(--p1); color: white; }

    .header-row {
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 64px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(117,105,142,0.3);
      margin-bottom: 0;
    }

    /* ── Two-panel layout ─────────────────────────────── */
    .layout {
      display: flex;
      gap: 24px;
      padding: 24px 64px 32px;
      flex: 1;
      height: calc(100vh - 168px);
    }

    /* ── Left sidebar ─────────────────────────────────── */
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      background: var(--p3);
      border: 1px solid rgba(117,105,142,0.25);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px 16px 12px;
      flex-shrink: 0;
    }

    .sidebar-title-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .sidebar-title {
      font-size: 12px; font-weight: 600; color: var(--p1);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .btn-icon {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 6px;
      background: none; border: none; cursor: pointer;
      color: var(--p1);
      transition: color 0.15s, background 0.15s;
    }
    .btn-icon:hover { color: white; background: rgba(255,255,255,0.06); }

    .selected-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .selected-count { font-size: 13px; color: var(--p1); }
    .btn-clear {
      font-family: var(--font-b); font-size: 12px; font-weight: 600;
      color: var(--r1); background: none; border: none; cursor: pointer;
    }
    .btn-clear:hover { text-decoration: underline; }

    .search-wrap {
      position: relative; margin-bottom: 12px;
    }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      opacity: 0.4; pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--p2);
      border: 1px solid rgba(117,105,142,0.4);
      border-radius: 8px;
      padding: 10px 12px 10px 36px;
      font-family: var(--font-b); font-size: 14px; color: white; outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: rgba(117,105,142,0.7); }
    .search-input:focus { border-color: var(--p1); }

    .teams-dropdown {
      position: relative; margin-bottom: 12px;
    }
    .dropdown-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--p2);
      border: 1px solid rgba(117,105,142,0.4);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: var(--font-b); font-size: 14px; color: rgba(255,255,255,0.4);
      cursor: pointer; text-align: left;
    }

    .pos-pills { display: flex; gap: 8px; padding-bottom: 12px; }
    .pos-pill {
      border-radius: 100px; padding: 4px 12px;
      font-family: var(--font-b); font-size: 13px; font-weight: 600;
      cursor: pointer; border: none;
      transition: background 0.15s, color 0.15s;
      background: transparent; color: var(--p1);
      box-shadow: inset 0 0 0 1px rgba(117,105,142,0.5);
    }
    .pos-pill.active {
      background: var(--gn1); color: var(--p4); box-shadow: none;
    }

    .sidebar-divider { border-bottom: 1px solid rgba(117,105,142,0.25); }

    /* Player list */
    .player-list { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--p1) transparent; }

    .player-row {
      width: 100%; display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      text-align: left; cursor: pointer;
      border: none;
      border-left: 3px solid transparent;
      background: transparent;
      transition: background 0.12s;
      color: white; font-family: var(--font-b);
    }
    .player-row:hover { background: rgba(255,255,255,0.04); }
    .player-row.selected {
      background: rgba(130,211,74,0.08);
      border-left-color: var(--gn1);
    }

    .player-logo {
      width: 32px; height: 32px; border-radius: 4px;
      background: var(--p4);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-h); font-size: 9px; color: var(--p1);
      flex-shrink: 0;
      font-size: 8px; letter-spacing: 0.03em;
    }

    .player-info { flex: 1; min-width: 0; }
    .player-name {
      font-size: 15px; font-weight: 700; color: white;
      line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .player-row.selected .player-name { color: var(--gn1); }
    .player-team { font-size: 12px; color: var(--p1); line-height: 1.3; }

    .player-pos {
      font-size: 13px; font-weight: 700;
      color: rgba(117,105,142,0.8); flex-shrink: 0;
    }
    .player-row.selected .player-pos { color: var(--gn1); }

    /* ── Right content area ───────────────────────────── */
    .content {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 24px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* ── PlayerCard (full) ────────────────────────────── */
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--p4);
      border: 1px solid var(--p1);
      border-radius: 12px 12px 0 0;
      padding: 12px 20px;
      cursor: pointer; user-select: none;
    }
    .card-header.collapsed { border-radius: 12px; }

    .card-name { font-family: var(--font-h); font-size: 24px; color: white; line-height: 1; }

    .card-header-right { display: flex; align-items: center; gap: 8px; }

    .chevron {
      width: 20px; height: 20px; color: var(--p1); flex-shrink: 0;
      transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .chevron.open { transform: rotate(180deg); }

    .btn-remove {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 6px;
      background: none; border: none; cursor: pointer;
      color: var(--r1);
      transition: color 0.15s, background-color 0.15s;
    }
    .btn-remove:hover { color: white; background-color: rgba(198,57,57,0.14); }

    /* grid-template-rows collapse trick — smooth animation, no JS height calc */
    .card-body-outer {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 280ms cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }
    .card-body-outer.collapsed { grid-template-rows: 0fr; }
    .card-body-inner { min-height: 0; }

    .card-body { display: flex; }

    .left-panel {
      width: 225px; flex-shrink: 0;
      background: var(--p2);
      border: 1px solid var(--p1); border-top: none; border-radius: 0 0 0 12px;
      padding: 20px;
      display: flex; flex-direction: column; gap: 17px;
    }

    .team-row { display: flex; align-items: center; gap: 9px; }
    .team-logo-block {
      width: 45px; height: 44px; border-radius: 4px;
      background: var(--p3);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-h); font-size: 9px; color: var(--p1);
      flex-shrink: 0; letter-spacing: 0.03em;
    }
    .team-city { font-size: 14px; font-weight: 600; color: white; line-height: 1.3; }
    .team-abv  { font-size: 13px; font-weight: 600; color: var(--p1); line-height: 1; margin-top: 4px; }

    .attrs-row { display: flex; justify-content: space-between; }
    .attr-col  { display: flex; flex-direction: column; gap: 6px; }
    .attr-lbl  { font-size: 12px; font-weight: 600; color: var(--p1); line-height: 1; }

    .chip {
      display: inline-flex; align-items: center;
      height: 22px; padding: 0 8px; border-radius: 100px;
      border: 1px solid rgba(117,105,142,0.5);
      font-size: 11px; font-weight: 600; color: white; white-space: nowrap;
    }
    .chip-green  { border-color: var(--gn1);  color: var(--gn1); }
    .chip-pink   { border-color: var(--pk1);  color: var(--pk1); }
    .chip-yellow { border-color: var(--y1);   color: var(--y1); }
    .chip-blue   { border-color: var(--bl1);  color: var(--bl1); }
    .chip-red    { border-color: var(--r1);   color: var(--r1); }

    .photo-ovr {
      flex: 1; display: flex; flex-direction: column;
      border-radius: 12px; overflow: hidden; min-height: 140px;
    }
    .photo-area {
      flex: 1; background: var(--p3);
      display: flex; align-items: center; justify-content: center;
    }
    .silhouette { opacity: 0.15; image-rendering: pixelated; }

    .ovr-bar {
      background: var(--p3); border-top: 1px solid rgba(117,105,142,0.3);
      padding: 11px;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .ovr-label { font-size: 12px; font-weight: 600; color: var(--p1); line-height: 1.5; white-space: pre; }
    .ovr-num   { font-family: var(--font-h); font-size: 48px; color: white; line-height: 1; }
    .ovr-rank  { display: flex; flex-direction: column; gap: 7px; }
    .ovr-rank-lbl { font-size: 12px; font-weight: 600; color: var(--p1); line-height: 1; }

    .right-panel {
      flex: 1; min-width: 0;
      background: var(--p2);
      border: 1px solid var(--p1); border-top: none; border-left: none;
      border-radius: 0 0 12px 0;
      padding: 20px;
      display: grid; grid-template-columns: 1fr 1fr;
      column-gap: 16px; row-gap: 36px;
      align-content: start;
    }

    /* ── PlayerStatsbar ───────────────────────────────── */
    .statsbar { display: flex; align-items: center; gap: 16px; }
    .stat-badge {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
    }
    .stat-badge-num { font-family: var(--font-h); font-size: 24px; line-height: 1; color: white; }
    .stat-meta { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .stat-name { font-size: 16px; font-weight: 600; color: white; line-height: 1; }
    .stat-bar  { display: flex; gap: 1px; height: 8px; border-radius: 100px; overflow: hidden; }
    .stat-seg  { flex: 1; }
    .stat-pct  { font-size: 12px; font-weight: 600; line-height: 1; text-align: right; }

    /* ── Compact card ─────────────────────────────────── */
    .compact-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    }
    .compact-card {
      border: 1px solid var(--p1); border-radius: 12px;
      overflow: hidden; background: var(--p2);
    }
    .compact-hdr {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--p4); border-bottom: 1px solid var(--p1);
      padding: 10px 16px;
    }
    .compact-name { font-family: var(--font-h); font-size: 18px; color: white; line-height: 1; }
    .compact-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .compact-team { display: flex; align-items: center; gap: 9px; }
    .compact-logo {
      width: 36px; height: 36px; border-radius: 4px;
      background: var(--p3);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-h); font-size: 8px; color: var(--p1); flex-shrink: 0;
    }
    .compact-attrs { display: flex; gap: 8px; }
    .compact-ovr-row {
      display: flex; border: 1px solid var(--p1); border-radius: 12px; overflow: hidden;
    }
    .compact-photo {
      flex: 1; background: var(--p3);
      display: flex; align-items: center; justify-content: center; aspect-ratio: 1;
    }
    .compact-ovr {
      flex: 1; background: var(--p3);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 12px; border-left: 1px solid var(--p1);
    }
    .compact-ovr-lbl { font-size: 11px; font-weight: 600; color: var(--p1); }
    .compact-ovr-num { font-family: var(--font-h); font-size: 44px; color: white; line-height: 1; }
    .small-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .small-badge {
      position: relative; height: 40px; border-radius: 8px; overflow: hidden;
    }
    .small-left {
      position: absolute; left: -2px; top: -2px;
      width: 32px; height: 40px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      border-width: 2px; border-style: solid;
    }
    .small-num { font-family: var(--font-h); font-size: 24px; line-height: 1; color: white; }
    .small-lbl {
      position: absolute; left: 37px; top: 50%; transform: translateY(-50%);
      width: 63px; font-size: 10px; font-weight: 600; line-height: 1.2; color: white;
    }

    /* ── Table view ───────────────────────────────────── */
    .table-wrap {
      background: var(--p2); border: 1px solid rgba(117,105,142,0.6);
      border-radius: 16px; overflow: hidden; overflow-x: auto;
    }
    .ptable { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 740px; }
    .ptable thead tr { background: var(--p4); border-bottom: 1px solid rgba(117,105,142,0.6); }
    .ptable th {
      padding: 10px 8px; font-size: 12px; font-weight: 500;
      color: rgba(255,255,255,0.5); text-align: center; white-space: nowrap;
    }
    .th-l { text-align: left; padding-left: 20px; }
    .ptable tbody tr:nth-child(odd)  { background: #271F35; }
    .ptable tbody tr:nth-child(even) { background: var(--p2); }
    .ptable tbody tr { border-bottom: 1px solid rgba(255,255,255,0.05); }
    .ptable tbody tr:last-child { border-bottom: none; }
    .ptable td { padding: 10px 8px; text-align: center; white-space: nowrap; }
    .td-l { text-align: left; padding-left: 20px; }
    .tbl-name-p { font-size: 14px; font-weight: 700; color: white; }
    .tbl-name-s { font-size: 12px; color: var(--p1); margin-top: 2px; }
    .tbl-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 7px;
    }
    .tbl-ovr { font-family: var(--font-h); font-size: 26px; color: white; line-height: 1; }

    /* ── Empty state ──────────────────────────────────── */
    .empty-state {
      background: var(--p3); border: 1px solid rgba(117,105,142,0.25);
      border-radius: 16px; padding: 80px 40px; text-align: center;
    }
    .empty-heading { font-family: var(--font-h); font-size: 24px; color: var(--p1); margin-bottom: 8px; }
    .empty-sub { font-size: 14px; color: rgba(117,105,142,0.6); }

    /* ── Tooltip (CSS-only, no JS) ───────────────────── */
    .tooltip { position: relative; }
    .tooltip::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%);
      background: #0B0910;
      border: 1px solid rgba(117,105,142,0.4);
      border-radius: 6px;
      padding: 5px 9px;
      font-family: var(--font-b);
      font-size: 12px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 50;
    }
    .tooltip:hover::after { opacity: 1; }
    .tooltip-below::after { top: calc(100% + 7px); bottom: auto; }

    /* ── View panels ──────────────────────────────────── */
    .view-panel { display: none; flex-direction: column; gap: 16px; }
    .view-panel.active { display: flex; }
    #compact-panel.active { display: block; }
    #table-panel.active { display: block; }
  </style>
</head>

<body>
<div class="page">

  <!-- Page header -->
  <div class="page-header">
    <p class="page-title">Player Attributes</p>
  </div>

  <!-- Subtitle + view toggle row -->
  <div class="header-row">
    <div class="page-sub">
      View player and goalie stat cards.
      <span class="badge-placeholder">Placeholder stats</span>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" data-view="full">Full</button>
      <button class="view-btn" data-view="compact">Compact</button>
      <button class="view-btn" data-view="table">Table</button>
    </div>
  </div>

  <!-- Two-panel layout -->
  <div class="layout">

    <!-- ── Left sidebar ──────────────────────────────── -->
    <div class="sidebar">
      <div class="sidebar-header">
        <!-- Title + collapse -->
        <div class="sidebar-title-row">
          <span class="sidebar-title">Players</span>
          <button class="btn-icon tooltip" data-tip="Hide player list">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <!-- Selected count + clear -->
        <div class="selected-row" id="selected-row" style="display:none">
          <span class="selected-count" id="selected-count">0 players selected</span>
          <button class="btn-clear" onclick="clearAll()">Clear</button>
        </div>

        <!-- Search -->
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="6.5" cy="6.5" r="5" stroke="white" stroke-width="1.5"/>
            <path d="M10.5 10.5L14 14" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input class="search-input" type="text" placeholder="Search players..." oninput="filterPlayers(this.value)" />
        </div>

        <!-- Teams dropdown -->
        <div class="teams-dropdown">
          <button class="dropdown-btn">
            <span>All Teams</span>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="opacity:0.4;flex-shrink:0">
              <path d="M3 5L7 9L11 5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <!-- Position pills -->
        <div class="pos-pills">
          <button class="pos-pill active" onclick="setPosFilter('all', this)">All</button>
          <button class="pos-pill" onclick="setPosFilter('F', this)">Forwards</button>
          <button class="pos-pill" onclick="setPosFilter('D', this)">Defense</button>
          <button class="pos-pill" onclick="setPosFilter('G', this)">Goalies</button>
        </div>

        <div class="sidebar-divider"></div>
      </div>

      <!-- Player list -->
      <div class="player-list" id="player-list"></div>
    </div>

    <!-- ── Right content ──────────────────────────────── -->
    <div class="content" id="content-area">
      <div class="empty-state" id="empty-state">
        <div class="empty-heading">SELECT A PLAYER</div>
        <p class="empty-sub">Click players from the list to view their stats</p>
      </div>

      <!-- Full view -->
      <div id="full-panel" class="view-panel"></div>
      <!-- Compact view -->
      <div id="compact-panel" class="view-panel"></div>
      <!-- Table view -->
      <div id="table-panel" class="view-panel">
        <div class="table-wrap">
          <table class="ptable">
            <thead>
              <tr>
                <th class="th-l" style="min-width:180px">Player</th>
                <th>TM</th><th>Pos</th><th><span class="tooltip tooltip-below" data-tip="Overall Rating">OVR</span></th>
                <th><span class="tooltip tooltip-below" data-tip="Speed">SPD</span></th>
                <th><span class="tooltip tooltip-below" data-tip="Agility">AGL</span></th>
                <th><span class="tooltip tooltip-below" data-tip="Shot Accuracy">SHA</span></th>
                <th><span class="tooltip tooltip-below" data-tip="Shot Power">SHP</span></th>
                <th><span class="tooltip tooltip-below" data-tip="Stick Handling">STH</span></th>
                <th><span class="tooltip tooltip-below" data-tip="Passing">PAS</span></th>
                <th><span class="tooltip tooltip-below" data-tip="Off. Awareness">OFA</span></th>
                <th><span class="tooltip tooltip-below" data-tip="Def. Awareness">DFA</span></th>
                <th><span class="tooltip tooltip-below" data-tip="Checking">CHK</span></th>
                <th><span class="tooltip tooltip-below" data-tip="Aggression">AGR</span></th>
                <th>Rank</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ── Tier system ──────────────────────────────────────────
const TIERS = [
  { badge:'#554B4B', stroke:'#717171', active:'#717171', dim:'#554B4B', filled:1,  fade:1, pct:'25–29%' },
  { badge:'#8B2828', stroke:'#C63939', active:'#C63939', dim:'#8B2828', filled:2,  fade:1, pct:'29–38%' },
  { badge:'#96471D', stroke:'#E4641B', active:'#E4641B', dim:'#96471D', filled:4,  fade:1, pct:'38–47%' },
  { badge:'#815E18', stroke:'#D89D27', active:'#D89D27', dim:'#815E18', filled:5,  fade:2, pct:'47–62%' },
  { badge:'#23598F', stroke:'#3380CC', active:'#3380CC', dim:'#23598F', filled:7,  fade:2, pct:'63–80%' },
  { badge:'#4C8922', stroke:'#82D34A', active:'#82D34A', dim:'#4C8922', filled:8,  fade:1, pct:'81–98%' },
  { badge:'#8B285D', stroke:'#C63984', active:'#C63984', dim:'#8B285D', filled:10, fade:0, pct:'99%'    },
]

function statsbar(tier, label) {
  const t = TIERS[tier]
  const segs = Array.from({length:10}, (_,i) => {
    const c = i < t.filled ? t.active : i < t.filled + t.fade ? t.dim : '#75698E'
    return `<div class="stat-seg" style="background:${c}"></div>`
  }).join('')
  return `<div class="statsbar">
    <div class="stat-badge" style="background:${t.badge};box-shadow:inset 0 0 0 1.5px ${t.stroke}">
      <span class="stat-badge-num">${tier}</span>
    </div>
    <div class="stat-meta">
      <span class="stat-name">${label}</span>
      <div class="stat-bar">${segs}</div>
      <span class="stat-pct" style="color:${t.stroke}">${t.pct}</span>
    </div>
  </div>`
}

function smallBadge(tier, label, fullLabel) {
  const t = TIERS[tier]
  return `<div class="tooltip" data-tip="${fullLabel}">
    <div class="small-badge" style="background:${t.badge};box-shadow:inset 0 0 0 2px ${t.stroke}">
      <div class="small-left" style="background:${t.badge};border-color:${t.stroke}">
        <span class="small-num">${tier}</span>
      </div>
      <div class="small-lbl">${label}</div>
    </div>
  </div>`
}

function tblBadge(tier) {
  const t = TIERS[tier]
  return `<div class="tbl-badge" style="background:${t.badge};box-shadow:inset 0 0 0 1.5px ${t.stroke}">
    <span style="font-family:Impact,'Arial Narrow',sans-serif;font-size:20px;line-height:1;color:#fff">${tier}</span>
  </div>`
}

function rankChip(ovr) {
  if (ovr >= 90) return `<span class="chip chip-pink">ELITE</span>`
  if (ovr >= 80) return `<span class="chip chip-green">GREAT</span>`
  if (ovr >= 70) return `<span class="chip chip-blue">GOOD</span>`
  if (ovr >= 60) return `<span class="chip chip-yellow">AVG</span>`
  return `<span class="chip chip-red">POOR</span>`
}

// ── Player data ──────────────────────────────────────────
const SKATER_ROWS = [
  ['spd','Speed'],['agl','Agility'],['sha','Shot Accuracy'],['shp','Shot Power'],
  ['sth','Stick Handling'],['pas','Passing'],['ofa','Off. Awareness'],['dfa','Def. Awareness'],
  ['chk','Checking'],['agr','Aggression'],
]
const GOALIE_ROWS = [
  ['spd','Speed'],['agl','Agility'],['dfa','Def. Awareness'],['pck','Puck Control'],
  ['glr','Glove Right'],['gll','Glove Left'],['str','Stick Right'],['stl','Stick Left'],
]

const ALL_PLAYERS = [
  { id:'gretzky', name:'Wayne Gretzky',   jno:'99', pos:'F', team:'Los Angeles Kings',    abv:'LAK', hand:'Left',  handLbl:'Shoots', weight:185, ovr:86, stats:{spd:5,agl:6,sha:6,shp:5,sth:6,pas:6,ofa:6,dfa:3,chk:1,agr:1} },
  { id:'lemieux', name:'Mario Lemieux',   jno:'66', pos:'F', team:'Pittsburgh Penguins',  abv:'PIT', hand:'Right', handLbl:'Shoots', weight:230, ovr:83, stats:{spd:5,agl:5,sha:6,shp:6,sth:5,pas:5,ofa:5,dfa:3,chk:4,agr:3} },
  { id:'hull',    name:'Brett Hull',      jno:'16', pos:'F', team:'St. Louis Blues',      abv:'STL', hand:'Right', handLbl:'Shoots', weight:201, ovr:78, stats:{spd:4,agl:4,sha:6,shp:6,sth:4,pas:4,ofa:5,dfa:2,chk:2,agr:2} },
  { id:'yzerman', name:'Steve Yzerman',   jno:'19', pos:'F', team:'Detroit Red Wings',    abv:'DET', hand:'Right', handLbl:'Shoots', weight:185, ovr:76, stats:{spd:5,agl:5,sha:4,shp:4,sth:5,pas:5,ofa:5,dfa:4,chk:3,agr:2} },
  { id:'mogilny', name:'Alexander Mogilny',jno:'89', pos:'F', team:'Buffalo Sabres',      abv:'BUF', hand:'Left',  handLbl:'Shoots', weight:187, ovr:74, stats:{spd:6,agl:5,sha:4,shp:5,sth:4,pas:4,ofa:5,dfa:2,chk:2,agr:2} },
  { id:'bourque', name:'Ray Bourque',     jno:'77', pos:'D', team:'Boston Bruins',        abv:'BOS', hand:'Right', handLbl:'Shoots', weight:210, ovr:77, stats:{spd:4,agl:4,sha:4,shp:5,sth:5,pas:5,ofa:4,dfa:6,chk:5,agr:4} },
  { id:'chelios', name:'Chris Chelios',   jno:'7',  pos:'D', team:'Chicago Blackhawks',   abv:'CHI', hand:'Right', handLbl:'Shoots', weight:186, ovr:73, stats:{spd:4,agl:4,sha:3,shp:4,sth:4,pas:4,ofa:3,dfa:5,chk:6,agr:5} },
  { id:'coffey',  name:'Paul Coffey',     jno:'74', pos:'D', team:'Detroit Red Wings',    abv:'DET', hand:'Left',  handLbl:'Shoots', weight:185, ovr:71, stats:{spd:5,agl:5,sha:3,shp:4,sth:4,pas:5,ofa:4,dfa:3,chk:3,agr:2} },
  { id:'roy',     name:'Patrick Roy',     jno:'33', pos:'G', team:'Montreal Canadiens',   abv:'MTL', hand:'Left',  handLbl:'Catches', weight:192, ovr:84, isGoalie:true, stats:{spd:4,agl:5,dfa:6,pck:5,glr:6,gll:5,str:5,stl:6} },
  { id:'belfour', name:'Ed Belfour',      jno:'30', pos:'G', team:'Chicago Blackhawks',   abv:'CHI', hand:'Left',  handLbl:'Catches', weight:182, ovr:79, isGoalie:true, stats:{spd:5,agl:4,dfa:5,pck:5,glr:5,gll:5,str:5,stl:4} },
  { id:'fuhr',    name:'Grant Fuhr',      jno:'31', pos:'G', team:'Buffalo Sabres',       abv:'BUF', hand:'Right', handLbl:'Catches', weight:201, ovr:74, isGoalie:true, stats:{spd:4,agl:4,dfa:4,pck:4,glr:5,gll:4,str:5,stl:4} },
]

// ── State ────────────────────────────────────────────────
let selectedIds = new Set(['gretzky', 'bourque'])
let posFilter = 'all'
let searchQuery = ''
let currentView = 'full'

function getFiltered() {
  return ALL_PLAYERS.filter(p => {
    if (posFilter !== 'all' && p.pos !== posFilter) return false
    const q = searchQuery.toLowerCase()
    if (q && !p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q)) return false
    return true
  })
}

// ── Sidebar render ───────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('player-list')
  const selRow = document.getElementById('selected-row')
  const selCount = document.getElementById('selected-count')

  if (selectedIds.size > 0) {
    selRow.style.display = 'flex'
    selCount.textContent = `${selectedIds.size} player${selectedIds.size !== 1 ? 's' : ''} selected`
  } else {
    selRow.style.display = 'none'
  }

  const players = getFiltered()
  list.innerHTML = players.map(p => {
    const sel = selectedIds.has(p.id)
    return `<button
      class="player-row ${sel ? 'selected' : ''}"
      onclick="togglePlayer('${p.id}')"
    >
      <div class="player-logo">${p.abv}</div>
      <div class="player-info">
        <div class="player-name">${p.name}</div>
        <div class="player-team">${p.team}</div>
      </div>
      <span class="player-pos">${p.pos}</span>
    </button>`
  }).join('')
}

// ── Card renders ─────────────────────────────────────────
function silhouette(pct) {
  return `<svg class="silhouette" width="${pct}%" height="${pct}%" viewBox="0 0 80 100">
    <rect x="28" y="8"  width="24" height="28" fill="#aaa"/>
    <rect x="24" y="36" width="32" height="6"  fill="#888"/>
    <rect x="16" y="42" width="48" height="44" fill="#999"/>
    <rect x="20" y="86" width="16" height="14" fill="#888"/>
    <rect x="44" y="86" width="16" height="14" fill="#888"/>
    <rect x="8"  y="44" width="10" height="28" fill="#888"/>
    <rect x="62" y="44" width="10" height="28" fill="#888"/>
  </svg>`
}

function fullCard(p) {
  const rows = p.isGoalie ? GOALIE_ROWS : SKATER_ROWS
  const statsHtml = rows.map(([k, lbl]) => statsbar(p.stats[k], lbl)).join('')
  const posLabel = p.pos === 'F' ? 'Forward' : p.pos === 'D' ? 'Defense' : 'Goalie'

  return `<div class="card-wrap" id="wrap-${p.id}">
    <div class="card-header open" onclick="toggleCard('${p.id}')">
      <span class="card-name">#${p.jno} ${p.name.toUpperCase()}</span>
      <div class="card-header-right">
        <svg class="chevron open" id="chev-${p.id}" viewBox="0 0 20 20" fill="none">
          <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <button class="btn-remove" onclick="event.stopPropagation();removePlayer('${p.id}')" aria-label="Remove">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="card-body-outer" id="body-${p.id}">
      <div class="card-body-inner">
        <div class="card-body">
          <div class="left-panel">
            <div class="team-row">
              <div class="team-logo-block">${p.abv}</div>
              <div>
                <div class="team-city">${p.team}</div>
                <div class="team-abv">${p.abv}</div>
              </div>
            </div>
            <div class="attrs-row">
              <div class="attr-col">
                <span class="attr-lbl">Position</span>
                <span class="chip">${posLabel}</span>
              </div>
              <div class="attr-col">
                <span class="attr-lbl">${p.handLbl}</span>
                <span class="chip">${p.hand}</span>
              </div>
              <div class="attr-col">
                <span class="attr-lbl">Weight</span>
                <span class="chip">${p.weight} lbs</span>
              </div>
            </div>
            <div class="photo-ovr">
              <div class="photo-area">${silhouette(56)}</div>
              <div class="ovr-bar">
                <span class="ovr-label">O\nV\nR</span>
                <span class="ovr-num">${p.ovr}</span>
                <div class="ovr-rank">
                  <span class="ovr-rank-lbl">Rank</span>
                  ${rankChip(p.ovr)}
                </div>
              </div>
            </div>
          </div>
          <div class="right-panel">${statsHtml}</div>
        </div>
      </div>
    </div>
  </div>`
}

function compactCard(p) {
  const rows = p.isGoalie ? GOALIE_ROWS : SKATER_ROWS
  const posLabel = p.pos === 'F' ? 'Forward' : p.pos === 'D' ? 'Defense' : 'Goalie'

  return `<div class="compact-card">
    <div class="compact-hdr">
      <span class="compact-name">#${p.jno} ${p.name.toUpperCase()}</span>
      <button class="btn-remove" onclick="removePlayer('${p.id}')" aria-label="Remove">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="compact-body">
      <div class="compact-team">
        <div class="compact-logo">${p.abv}</div>
        <div>
          <div style="font-size:14px;font-weight:600;color:white;line-height:1.3">${p.team}</div>
          <div style="font-size:12px;color:var(--p1);font-weight:600;margin-top:4px">${p.abv}</div>
        </div>
      </div>
      <div class="compact-attrs">
        <div class="attr-col"><span class="attr-lbl">Position</span><span class="chip">${posLabel}</span></div>
        <div class="attr-col"><span class="attr-lbl">${p.handLbl}</span><span class="chip">${p.hand}</span></div>
        <div class="attr-col"><span class="attr-lbl">Weight</span><span class="chip">${p.weight} lbs</span></div>
      </div>
      <div class="compact-ovr-row">
        <div class="compact-photo">${silhouette(55)}</div>
        <div class="compact-ovr">
          <span class="compact-ovr-lbl">Overall</span>
          <span class="compact-ovr-num">${p.ovr}</span>
          <div style="display:flex;flex-direction:column;gap:4px;align-items:center">
            <span style="font-size:11px;font-weight:600;color:var(--p1)">Rank</span>
            ${rankChip(p.ovr)}
          </div>
        </div>
      </div>
      <div class="small-grid">
        ${rows.map(([k, lbl]) => smallBadge(p.stats[k], k.toUpperCase(), lbl)).join('')}
      </div>
    </div>
  </div>`
}

function tableRow(p) {
  const rows = p.isGoalie ? GOALIE_ROWS : SKATER_ROWS
  const statCells = rows.map(([k]) => `<td>${tblBadge(p.stats[k])}</td>`).join('')
  const pad = p.isGoalie ? '<td></td><td></td>' : ''
  const posLabel = p.pos === 'F' ? 'Forward' : p.pos === 'D' ? 'Defense' : 'Goalie'
  return `<tr>
    <td class="td-l">
      <div class="tbl-name-p">#${p.jno} ${p.name}</div>
      <div class="tbl-name-s">${p.abv} · ${posLabel}</div>
    </td>
    <td><div class="team-logo-block" style="width:24px;height:24px;font-size:7px;display:inline-flex">${p.abv}</div></td>
    <td style="color:rgba(255,255,255,0.7)">${p.pos}</td>
    <td><span class="tbl-ovr">${p.ovr}</span></td>
    ${statCells}${pad}
    <td>${rankChip(p.ovr)}</td>
  </tr>`
}

// ── Right panel render ───────────────────────────────────
function renderContent() {
  const selected = ALL_PLAYERS.filter(p => selectedIds.has(p.id))
  const empty = document.getElementById('empty-state')
  const fullPanel    = document.getElementById('full-panel')
  const compactPanel = document.getElementById('compact-panel')
  const tablePanel   = document.getElementById('table-panel')

  // Show/hide empty state
  empty.style.display = selected.length === 0 ? 'block' : 'none'

  // Hide all panels, then show active
  ;[fullPanel, compactPanel, tablePanel].forEach(p => p.classList.remove('active'))

  if (selected.length === 0) return

  if (currentView === 'full') {
    fullPanel.innerHTML = selected.map(fullCard).join('')
    fullPanel.classList.add('active')
  } else if (currentView === 'compact') {
    compactPanel.innerHTML = `<div class="compact-grid">${selected.map(compactCard).join('')}</div>`
    compactPanel.classList.add('active')
  } else {
    const skaters = selected.filter(p => !p.isGoalie)
    const goalies  = selected.filter(p => p.isGoalie)
    const mkLabel = txt => `<div style="font-size:11px;font-weight:600;color:var(--p1);text-transform:uppercase;letter-spacing:.08em;padding-bottom:4px">${txt}</div>`
    let html = ''
    if (skaters.length && goalies.length) html += mkLabel('Forwards & Defense')
    if (skaters.length) html += `<div class="table-wrap"><table class="ptable">
      <thead><tr><th class="th-l">Player</th><th>TM</th><th>Pos</th><th><span class="tooltip tooltip-below" data-tip="Overall Rating">OVR</span></th>
      <th><span class="tooltip tooltip-below" data-tip="Speed">SPD</span></th><th><span class="tooltip tooltip-below" data-tip="Agility">AGL</span></th><th><span class="tooltip tooltip-below" data-tip="Shot Accuracy">SHA</span></th><th><span class="tooltip tooltip-below" data-tip="Shot Power">SHP</span></th><th><span class="tooltip tooltip-below" data-tip="Stick Handling">STH</span></th><th><span class="tooltip tooltip-below" data-tip="Passing">PAS</span></th><th><span class="tooltip tooltip-below" data-tip="Off. Awareness">OFA</span></th><th><span class="tooltip tooltip-below" data-tip="Def. Awareness">DFA</span></th><th><span class="tooltip tooltip-below" data-tip="Checking">CHK</span></th><th><span class="tooltip tooltip-below" data-tip="Aggression">AGR</span></th><th>Rank</th>
      </tr></thead><tbody>${skaters.map(tableRow).join('')}</tbody></table></div>`
    if (skaters.length && goalies.length) html += mkLabel('Goalies')
    if (goalies.length) html += `<div class="table-wrap"><table class="ptable">
      <thead><tr><th class="th-l">Player</th><th>TM</th><th>Pos</th><th><span class="tooltip tooltip-below" data-tip="Overall Rating">OVR</span></th>
      <th><span class="tooltip tooltip-below" data-tip="Speed">SPD</span></th><th><span class="tooltip tooltip-below" data-tip="Agility">AGL</span></th><th><span class="tooltip tooltip-below" data-tip="Def. Awareness">DFA</span></th><th><span class="tooltip tooltip-below" data-tip="Puck Control">PCK</span></th><th><span class="tooltip tooltip-below" data-tip="Glove Right">GLR</span></th><th><span class="tooltip tooltip-below" data-tip="Glove Left">GLL</span></th><th><span class="tooltip tooltip-below" data-tip="Stick Right">STR</span></th><th><span class="tooltip tooltip-below" data-tip="Stick Left">STL</span></th><th></th><th></th><th>Rank</th>
      </tr></thead><tbody>${goalies.map(tableRow).join('')}</tbody></table></div>`
    tablePanel.innerHTML = html
    tablePanel.classList.add('active')
  }
}

// ── Actions ──────────────────────────────────────────────
function togglePlayer(id) {
  selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id)
  renderSidebar()
  renderContent()
}

function removePlayer(id) {
  selectedIds.delete(id)
  renderSidebar()
  renderContent()
}

function clearAll() {
  selectedIds.clear()
  renderSidebar()
  renderContent()
}

function filterPlayers(q) {
  searchQuery = q
  renderSidebar()
}

function setPosFilter(pos, btn) {
  posFilter = pos
  document.querySelectorAll('.pos-pill').forEach(p => p.classList.remove('active'))
  btn.classList.add('active')
  renderSidebar()
}

function toggleCard(id) {
  const body = document.getElementById('body-' + id)
  const chev = document.getElementById('chev-' + id)
  const hdr  = body.previousElementSibling
  const isOpen = !body.classList.contains('collapsed')
  body.classList.toggle('collapsed', isOpen)
  chev.classList.toggle('open', !isOpen)
  hdr.classList.toggle('collapsed', isOpen)
}

// View mode switch
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    currentView = btn.dataset.view
    renderContent()
  })
})

// Initial render
renderSidebar()
renderContent()
</script>
</body>
</html>
