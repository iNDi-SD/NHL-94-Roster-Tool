<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHL '94 · Draft Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --p5:#0B0910;--p4:#211D28;--p3:#1E192A;--p2:#2A2339;--ph:#352E43;--p1:#75698E;
      --g1:#82D34A;--g2:#4C8922;--gd:rgba(130,211,74,.12);
      --y1:#D89D27;--b1:#3380CC;--r1:#C63939;
      --tx:#F0EDF5;--md:#A89BC4;--dm:#75698E;
      --br:rgba(117,105,142,.16);--br2:rgba(117,105,142,.32);
      --panel-bg:rgba(28,23,38,.97);
      --cw:196px;--ch:108px;--cgap:6px;
    }
    @media(max-width:1023px){
      :root{--cw:88px;--ch:62px;--cgap:4px}
      .board-th{padding:5px 7px;gap:5px}
      .bth-logo{width:24px;height:24px;font-size:7px}
      .bth-name{font-size:10px}
      .bth-picks{display:none}
      .board-rlbl-spacer,.board-rlbl{width:24px}
      .board-team-row{padding:6px 6px 3px}
      .board-rows{padding:3px 6px 6px}
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
    body{font-family:'Roboto',sans-serif;background:var(--p5);color:var(--tx)}

    /* ════════════════════════════════
       BOARD
    ════════════════════════════════ */
    .board-bg{
      position:fixed;top:52px;left:0;right:0;bottom:0;
      overflow:auto;z-index:1;scrollbar-width:none;
    }
    @media(max-width:1023px){.board-bg{top:52px}}
    .board-bg::-webkit-scrollbar{display:none}
    .board-inner{min-width:max-content;padding:0 0 16px}

    .board-team-row{
      display:flex;gap:var(--cgap);
      padding:8px 8px 4px;
      position:sticky;top:0;z-index:10;
      background:rgba(11,9,16,.94);
      backdrop-filter:blur(16px);
    }
    .board-th{
      flex:0 0 var(--cw);
      padding:6px 10px;
      display:flex;align-items:center;gap:8px;
      border-radius:8px;
      background:rgba(255,255,255,.04);
      min-width:0;
    }
    .bth-logo{
      width:28px;height:28px;border-radius:50%;flex-shrink:0;
      background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
      display:flex;align-items:center;justify-content:center;
      font-size:8px;font-weight:900;color:var(--md);overflow:hidden;
    }
    .bth-logo.mine-logo{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.08)}
    .bth-logo.current{border-color:rgba(255,255,255,.7)!important;background:rgba(255,255,255,.1)!important;color:var(--tx)!important;animation:glow-pulse 2s ease-in-out infinite}
    .bth-name-cur{color:var(--tx)!important;font-weight:900}
    .bth-name{font-size:11px;font-weight:700;color:var(--dm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
    .board-th.mine-col .bth-name{color:var(--tx)}
    .bth-picks{font-size:9px;font-weight:700;color:rgba(255,255,255,.2);flex-shrink:0;white-space:nowrap}
    .board-th.mine-col .bth-picks{color:rgba(255,255,255,.4)}

    .board-rows{display:flex;flex-direction:column;gap:var(--cgap);padding:4px 8px 8px}
    .board-row{display:flex;gap:var(--cgap)}

    /* Round label column */
    .board-rlbl-spacer{width:32px;flex-shrink:0}
    .board-rlbl{
      width:32px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:9px;font-weight:900;color:var(--dm);
      text-transform:uppercase;letter-spacing:.05em;
      user-select:none;
    }

    /* ── Cell base ── */
    .board-cell{
      flex:0 0 var(--cw);height:var(--ch);
      border-radius:12px;overflow:hidden;
      display:flex;position:relative;cursor:default;
    }

    /* Empty */
    .board-cell.empty{
      background:#09080d;
      border:1px solid rgba(255,255,255,.06);
    }

    /* Position fills — dark + colored border */
    .board-cell.pos-F{background:#0c1c30;border:1.5px solid #3870aa}
    .board-cell.pos-D{background:#201600;border:1.5px solid #886800}
    .board-cell.pos-G{background:#1c0c16;border:1.5px solid #8a2d58}

    /* Mine: brighter border */
    .board-cell.pos-F.mine{border-color:#5a9fd8;border-width:2px}
    .board-cell.pos-D.mine{border-color:#c09010;border-width:2px}
    .board-cell.pos-G.mine{border-color:#c04878;border-width:2px}

    /* My team's future column — subtle white tint */
    .board-cell.my-col{
      background:rgba(255,255,255,.03);
      border-color:rgba(255,255,255,.14);
    }

    /* Current pick — silver-white, distinct from all position colors */
    .board-cell.current{
      background:rgba(255,255,255,.1)!important;
      border:2px solid rgba(255,255,255,.7)!important;
      animation:glow-pulse 2s ease-in-out infinite;
    }
    @keyframes glow-pulse{
      0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.12),0 0 14px rgba(255,255,255,.08)}
      50%{box-shadow:0 0 0 4px rgba(255,255,255,.22),0 0 26px rgba(255,255,255,.18)}
    }

    /* ── Pick number — shared absolute, both breakpoints ── */
    .bc-pnum{
      position:absolute;top:8px;right:9px;z-index:2;
      font-size:11px;font-weight:700;line-height:1;
      color:rgba(255,255,255,.28);
    }
    .board-cell.current .bc-pnum{color:rgba(255,255,255,.45)}

    /* ── Desktop cell layout ── */
    .bc-desk{
      display:flex;flex-direction:column;
      width:100%;height:100%;
      padding:8px;
    }
    .bc-posline{font-size:12px;margin-bottom:2px}
    .board-cell.pos-F .bc-posline{color:rgba(100,160,215,.78)}
    .board-cell.pos-D .bc-posline{color:rgba(195,155,45,.78)}
    .board-cell.pos-G .bc-posline{color:rgba(200,80,140,.78)}
    .bc-name{
      font-size:16px;font-weight:700;color:var(--tx);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .bc-thumb{
      width:48px;height:48px;
      border-radius:6px;margin-top:8px;
      background-size:cover;background-position:center top;
    }
    .board-cell.pos-F .bc-thumb{background-color:rgba(50,110,165,.25)}
    .board-cell.pos-D .bc-thumb{background-color:rgba(135,100,0,.22)}
    .board-cell.pos-G .bc-thumb{background-color:rgba(138,45,88,.22)}
    .bc-clock{
      font-size:11px;font-weight:900;color:rgba(255,255,255,.5);
      text-transform:uppercase;letter-spacing:.08em;
    }
    .bc-clock-team{
      font-size:14px;font-weight:700;color:var(--tx);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      margin-top:1px;
    }
    .bc-cell-timer{
      font-size:30px;font-weight:900;
      font-family:'Roboto Condensed',sans-serif;
      color:var(--tx);line-height:1;letter-spacing:-.01em;
    }
    .bc-cell-timer.urgent{color:var(--r1);animation:blink 1s infinite}
    .bc-mob-clock-team{
      font-size:12px;font-weight:700;color:var(--tx);margin-top:1px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .bc-mob-cell-timer{
      font-size:20px;font-weight:900;
      font-family:'Roboto Condensed',sans-serif;
      color:var(--tx);line-height:1;margin-top:2px;
    }
    .bc-mob-cell-timer.urgent{color:var(--r1);animation:blink 1s infinite}
    .bc-spacer{flex:1}


    /* ── Mobile cell layout ── */
    .bc-mob{
      display:none;
      width:100%;height:100%;
      flex-direction:column;
      padding:8px 10px;
    }
    .bc-mob-top{display:flex;align-items:center;justify-content:space-between}
    .bc-mob-pnum{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);flex-shrink:0}
    .bc-mob-posline{font-size:12px;font-weight:700}
    .board-cell.pos-F .bc-mob-posline{color:rgba(100,160,215,.82)}
    .board-cell.pos-D .bc-mob-posline{color:rgba(195,155,45,.82)}
    .board-cell.pos-G .bc-mob-posline{color:rgba(200,80,140,.82)}
    .bc-mob-names{display:flex;flex-direction:column;gap:1px;margin-top:4px}
    .bc-mob-first,.bc-mob-last{font-size:16px;font-weight:700;color:var(--tx);line-height:1.2}
    .bc-mob-clock{
      font-size:10px;font-weight:900;color:rgba(255,255,255,.5);
      text-transform:uppercase;letter-spacing:.08em;
    }
    .bc-mob-footer{display:flex;justify-content:flex-end;margin-top:3px}

    @media(max-width:1023px){
      .bc-pnum{display:none}
      .bc-desk{display:none}
      .bc-mob{display:flex;padding:7px 8px}
      .bc-mob-posline{font-size:10px}
      .bc-mob-first,.bc-mob-last{font-size:11px;line-height:1.15}
      .bc-mob-clock-team{font-size:10px}
      .bc-mob-cell-timer{font-size:16px}
    }

    /* ════════════════════════════════
       DESKTOP TOPBAR
    ════════════════════════════════ */
    .desk-topbar{
      position:fixed;top:0;left:0;right:0;height:52px;z-index:100;
      background:rgba(28,23,38,.92);backdrop-filter:blur(18px);
      border-bottom:1px solid var(--br2);
      display:flex;align-items:center;padding:0 16px;gap:12px;
    }
    @media(max-width:1023px){.desk-topbar{display:none}}

    .dt-left{display:flex;align-items:center;gap:10px;min-width:0}
    .back-btn{
      background:rgba(255,255,255,.07);border:1px solid var(--br2);
      color:var(--md);border-radius:8px;width:30px;height:30px;
      display:flex;align-items:center;justify-content:center;
      font-size:18px;cursor:pointer;font-weight:700;flex-shrink:0;
      transition:background .1s;line-height:1;
    }
    .back-btn:hover{background:rgba(255,255,255,.13)}
    .draft-name-lbl{font-size:14px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
    .dt-center{flex:1;display:flex;justify-content:center}
    .start-btn{
      display:flex;align-items:center;gap:7px;
      padding:7px 20px;border-radius:20px;border:none;
      font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;
      cursor:pointer;font-family:'Roboto',sans-serif;transition:all .15s;
    }
    .start-btn.state-setup,.start-btn.state-paused{background:var(--g1);color:var(--p5)}
    .start-btn.state-setup:hover,.start-btn.state-paused:hover{background:var(--g2)}
    .start-btn.state-running{background:rgba(216,157,39,.2);color:var(--y1);border:1px solid rgba(216,157,39,.4)}
    .start-btn.state-running:hover{background:rgba(216,157,39,.3)}
    .dt-right{display:flex;align-items:center;gap:10px}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
    .demo-sep{width:1px;height:24px;background:var(--br2)}
    .demo-row{display:flex;gap:5px}
    .d-btn{
      background:rgba(255,255,255,.06);border:1px solid var(--br2);
      color:var(--md);border-radius:6px;padding:3px 9px;
      font-size:10px;font-weight:700;cursor:pointer;
      font-family:'Roboto',sans-serif;white-space:nowrap;transition:all .1s;
    }
    .d-btn:hover{background:rgba(255,255,255,.12)}
    .d-btn.on{background:var(--gd);border-color:var(--g1);color:var(--g1)}

    /* ════════════════════════════════
       MOBILE TOPBAR
    ════════════════════════════════ */
    .mob-topbar{
      position:fixed;top:0;left:0;right:0;z-index:100;
      background:rgba(28,23,38,.92);backdrop-filter:blur(18px);
      border-bottom:1px solid var(--br2);
    }
    @media(min-width:1024px){.mob-topbar{display:none}}

    .mt-row1{
      height:52px;display:flex;align-items:center;
      padding:0 14px;gap:10px;
    }
    .mob-back-btn{
      background:rgba(255,255,255,.07);border:1px solid var(--br2);
      color:var(--md);border-radius:8px;width:32px;height:32px;
      display:flex;align-items:center;justify-content:center;
      font-size:20px;cursor:pointer;font-weight:700;line-height:1;flex-shrink:0;
    }
    .mob-start-btn{
      flex:1;display:flex;align-items:center;justify-content:center;
      gap:6px;padding:7px 16px;border-radius:20px;border:none;
      font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;
      cursor:pointer;font-family:'Roboto',sans-serif;transition:all .15s;
    }
    .mob-start-btn.state-setup{background:var(--g1);color:var(--p5)}
    .mob-gear-btn{
      background:rgba(255,255,255,.07);border:1px solid var(--br2);
      color:var(--md);border-radius:8px;width:32px;height:32px;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;cursor:pointer;flex-shrink:0;
    }

    /* Running state: centered pill + timer */
    .mt-center{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:6px;
    }
    .mt-status-pill{
      padding:2px 12px;border-radius:20px;
      font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;
      white-space:nowrap;
    }
    .mt-status-pill.my-turn{
      background:rgba(216,157,39,.2);color:var(--y1);
      border:1px solid rgba(216,157,39,.4);
    }
    .mt-status-pill.on-clock{
      background:rgba(255,255,255,.1);color:var(--tx);
      border:1.5px solid rgba(255,255,255,.65);
      animation:glow-pulse 2s ease-in-out infinite;
    }
    .mob-timer-val{
      font-size:17px;font-weight:900;font-family:'Roboto Condensed',sans-serif;
      color:var(--tx);line-height:1;
    }
    .mob-timer-val.urgent{color:var(--r1);animation:blink 1s infinite}

    /* Team strip row — hidden on mobile */
    .mt-team-strip-row{display:none}
    .mt-team-strip{
      display:flex;gap:6px;overflow-x:auto;
      padding:4px 14px;scrollbar-width:none;align-items:center;flex:1;
    }
    .mt-team-strip::-webkit-scrollbar{display:none}
    .mt-team-chip{
      display:flex;flex-direction:column;align-items:center;gap:2px;
      flex-shrink:0;cursor:pointer;
    }
    .mt-chip-logo{
      width:28px;height:28px;border-radius:50%;
      background:rgba(255,255,255,.08);border:2px solid transparent;
      display:flex;align-items:center;justify-content:center;
      font-size:7px;font-weight:900;color:var(--dm);transition:all .15s;
    }
    .mt-chip-logo.mine{border-color:rgba(255,255,255,.35);color:var(--md)}
    .mt-chip-logo.current{
      border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.1);color:var(--tx);
      animation:glow-pulse 2s ease-in-out infinite;
    }
    .mt-chip-name{font-size:7px;font-weight:700;color:var(--dm);white-space:nowrap}
    .mt-chip-logo.mine+.mt-chip-name{color:var(--md)}
    .mt-chip-logo.current+.mt-chip-name{color:var(--tx);font-weight:900}

    /* Settings sheet */
    .settings-overlay{
      position:fixed;inset:0;z-index:200;
      background:rgba(0,0,0,.5);
      opacity:0;pointer-events:none;transition:opacity .2s;
    }
    .settings-overlay.visible{opacity:1;pointer-events:auto}
    .settings-sheet{
      position:fixed;bottom:0;left:0;right:0;z-index:201;
      background:var(--panel-bg);backdrop-filter:blur(20px);
      border-radius:22px 22px 0 0;
      border-top:1px solid rgba(255,255,255,.1);
      transform:translateY(100%);
      transition:transform .25s cubic-bezier(.32,0,.67,0);
    }
    .settings-sheet.visible{transform:translateY(0)}
    .settings-grab{
      padding:12px 0 8px;
      display:flex;justify-content:center;cursor:pointer;
    }
    .settings-content{padding:0 16px 24px;display:flex;flex-direction:column;gap:8px}
    .settings-action{
      display:flex;align-items:center;gap:10px;
      padding:14px 16px;border-radius:12px;
      background:rgba(255,255,255,.06);border:1px solid var(--br2);
      color:var(--tx);font-size:14px;font-weight:700;
      cursor:pointer;font-family:'Roboto',sans-serif;
      transition:background .1s;text-align:left;width:100%;
    }
    .settings-action:hover{background:rgba(255,255,255,.1)}

    /* ════════════════════════════════
       BOTTOM CARD (desktop)
    ════════════════════════════════ */
    .bottom-card{
      position:fixed;bottom:0;left:0;right:0;z-index:40;
      display:flex;flex-direction:column;overflow:hidden;
      background:var(--panel-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border-radius:20px 20px 0 0;
      border-top:1px solid rgba(255,255,255,.1);
      box-shadow:0 -8px 40px rgba(0,0,0,.6);
      height:52vh;
    }
    .bc-grab{
      flex-shrink:0;padding:8px 0 4px;
      display:flex;align-items:center;justify-content:center;
      cursor:ns-resize;user-select:none;
    }
    .bc-hide-btn{
      flex-shrink:0;padding:4px 11px;border-radius:20px;
      font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
      background:none;border:1px solid var(--br2);color:var(--dm);
      cursor:pointer;font-family:'Roboto',sans-serif;transition:all .12s;white-space:nowrap;
    }
    .bc-hide-btn:hover{border-color:rgba(255,255,255,.25);color:var(--tx)}
    .bc-body{flex:1;display:flex;overflow:hidden;min-height:0}
    .bc-players{
      flex:1;min-width:200px;
      display:flex;flex-direction:column;overflow:hidden;
    }
    .bc-resizer{
      width:10px;flex-shrink:0;position:relative;
      background:rgba(0,0,0,.28);cursor:ew-resize;transition:background .15s;
    }
    .bc-resizer::after{
      content:'';position:absolute;
      left:50%;top:50%;transform:translate(-50%,-50%);
      width:2px;height:40px;
      background:rgba(255,255,255,.18);border-radius:1px;
    }
    .bc-resizer:hover,.bc-resizer.dragging{background:rgba(130,211,74,.15)}
    .bc-resizer:hover::after,.bc-resizer.dragging::after{background:rgba(130,211,74,.55)}
    .bc-resizer.hidden{display:none}
    .bc-side{
      width:264px;min-width:160px;flex-shrink:0;
      display:flex;flex-direction:column;overflow:hidden;
    }
    .bc-side.hidden{display:none}
    .bc-side-header{
      flex-shrink:0;height:44px;display:flex;align-items:center;
      padding:0 10px;gap:2px;
      background:var(--p3);border-bottom:1px solid var(--br);
    }
    .bc-side-tab{
      padding:6px 14px;border-radius:20px;
      font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
      color:var(--dm);cursor:pointer;border:none;background:none;
      font-family:'Roboto',sans-serif;transition:all .12s;
    }
    .bc-side-tab.active{background:rgba(255,255,255,.1);color:var(--tx)}
    .bc-side-section{
      display:none;flex:1;overflow:hidden;
      flex-direction:column;min-height:0;
    }
    .bc-side-section.active{display:flex}

    .drag-pip{width:40px;height:4px;background:rgba(255,255,255,.18);border-radius:2px}

    /* ════════════════════════════════
       PLAYER PANEL CONTENT
    ════════════════════════════════ */
    .player-filter-bar{
      flex-shrink:0;height:44px;display:flex;align-items:center;gap:8px;
      padding:0 14px;
      background:var(--p3);border-bottom:1px solid var(--br);
      overflow-x:auto;scrollbar-width:none;
    }
    .player-filter-bar::-webkit-scrollbar{display:none}
    .search-wrap{position:relative;max-width:300px;flex:1;min-width:0}
    .search-input{
      background:rgba(255,255,255,.07);border:1px solid var(--br2);
      border-radius:10px;padding:7px 10px 7px 30px;
      color:var(--tx);font-size:12px;outline:none;width:100%;
      font-family:'Roboto',sans-serif;transition:border-color .12s;
    }
    .search-input:focus{border-color:var(--g1)}
    .search-input::placeholder{color:var(--dm)}
    .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--dm);font-size:12px;pointer-events:none}
    .pos-pills{display:flex;gap:5px;flex-wrap:wrap}
    .pos-pill{
      padding:6px 14px;border-radius:20px;border:1px solid var(--br2);
      background:rgba(255,255,255,.05);color:var(--md);
      cursor:pointer;font-family:'Roboto',sans-serif;transition:all .1s;
      display:flex;flex-direction:row;align-items:center;gap:5px;
      flex-shrink:0;white-space:nowrap;
    }
    .pos-pill.active{border-color:var(--g1);background:var(--gd);color:var(--g1)}
    .pp-pos{font-size:14px;font-weight:700;line-height:1}
    .pp-ct{font-size:12px;font-weight:500;line-height:1;opacity:.7;
      font-family:'Roboto',sans-serif}
    .show-drafted-lbl{
      display:flex;align-items:center;gap:5px;font-size:11px;
      color:var(--dm);cursor:pointer;margin-left:auto;user-select:none;white-space:nowrap;
    }
    .show-drafted-lbl input{accent-color:var(--g1)}

    .table-scroll{flex:1;overflow-y:auto}
    .dt{width:100%;border-collapse:collapse}
    .dt thead th{
      background:rgba(11,9,16,.8);backdrop-filter:blur(8px);
      padding:7px 10px;font-size:9px;font-weight:900;text-transform:uppercase;
      letter-spacing:.07em;color:var(--dm);white-space:nowrap;
      border-bottom:1px solid var(--br2);position:sticky;top:0;z-index:5;text-align:right;
    }
    .dt thead th.col-draft{width:72px;text-align:left}
    .dt thead th.col-player{text-align:left;min-width:140px}
    .dt thead th.col-q{width:36px;text-align:center}
    .dt thead th.sortable{cursor:pointer;user-select:none;transition:color .1s}
    .dt thead th.sortable:hover{color:var(--tx)}
    .dt thead th.sort-active{color:var(--g1)}
    .sort-arrow{font-size:8px;opacity:.7;margin-left:2px}
    .dt tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .08s}
    .dt tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
    .dt tbody tr:hover{background:rgba(255,255,255,.07)!important}
    .dt tbody tr.drafted-row{opacity:.3}
    .dt td{padding:7px 10px;font-size:12px;text-align:right;white-space:nowrap;vertical-align:middle}
    .dt td.col-draft{text-align:left;padding:4px 10px}
    .dt td.col-player{text-align:left}
    .dt td.col-q{text-align:center;padding:4px 8px}
    .td-actions{display:flex;align-items:center;gap:5px}
    .draft-btn{
      background:var(--g1);color:var(--p5);border:none;
      border-radius:20px;padding:7px 16px;
      font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;
      cursor:pointer;font-family:'Roboto',sans-serif;transition:background .1s;
    }
    .draft-btn:hover{background:var(--g2)}
    .draft-btn:disabled{background:rgba(255,255,255,.12);color:var(--dm);cursor:default}
    .q-add-btn{
      width:24px;height:24px;border-radius:6px;
      background:rgba(255,255,255,.07);border:1px solid var(--br2);
      color:var(--dm);cursor:pointer;font-size:13px;
      display:inline-flex;align-items:center;justify-content:center;transition:all .1s;
    }
    .q-add-btn:hover{border-color:var(--g1);color:var(--g1)}
    .q-add-btn.on{background:var(--gd);border-color:var(--g1);color:var(--g1)}
    .td-name-inner{display:flex;flex-direction:column}
    .td-name{font-size:13px;font-weight:700}
    .td-sub{font-size:10px;color:var(--dm)}
    .sv-hi{color:var(--tx);font-weight:700}.sv-md{color:var(--tx);font-weight:400}.sv-lo{color:var(--dm);font-weight:400}

    /* ════════════════════════════════
       QUEUE + ROSTER (shared)
    ════════════════════════════════ */
    .q-auto-row{
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 14px;border-bottom:1px solid var(--br);flex-shrink:0;
    }
    .q-auto-lbl{font-size:11px;color:var(--md);font-weight:600}
    .toggle{
      width:34px;height:18px;background:rgba(255,255,255,.2);border-radius:9px;
      position:relative;cursor:pointer;border:none;transition:background .18s;flex-shrink:0;
    }
    .toggle.on{background:var(--g1)}
    .toggle::after{
      content:'';position:absolute;width:14px;height:14px;
      background:#fff;border-radius:50%;top:2px;left:2px;
      transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.4);
    }
    .toggle.on::after{left:18px}
    .q-scroll{flex:1;overflow-y:auto}
    .q-empty{padding:28px 14px;text-align:center}
    .q-empty-icon{font-size:26px;opacity:.3;margin-bottom:10px}
    .q-empty-title{font-size:13px;font-weight:700;color:var(--md);margin-bottom:5px}
    .q-empty-sub{font-size:11px;color:var(--dm);line-height:1.55}
    .q-item{
      display:flex;align-items:center;gap:8px;
      padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);
      transition:background .08s;cursor:pointer;
    }
    .q-item:nth-child(even){background:rgba(255,255,255,.025)}
    .q-item:hover{background:rgba(255,255,255,.07)!important}
    .q-item.q-selected{background:rgba(255,255,255,.07);border-left:2px solid rgba(255,255,255,.35);padding-left:12px}
    .q-move-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
    .q-move-btn{
      width:22px;height:18px;border-radius:4px;
      background:rgba(255,255,255,.07);border:1px solid var(--br2);
      color:var(--md);cursor:pointer;font-size:11px;line-height:1;
      display:flex;align-items:center;justify-content:center;
      font-family:'Roboto',sans-serif;transition:all .1s;
    }
    .q-move-btn:hover:not(:disabled){border-color:var(--g1);color:var(--g1)}
    .q-move-btn:disabled{opacity:.2;cursor:default}
    .q-pos{
      width:28px;height:26px;border-radius:6px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;
    }
    .q-pos.F{background:rgba(51,128,204,.28);color:#7AB8F5}
    .q-pos.D{background:rgba(216,157,39,.22);color:#E8B84B}
    .q-pos.G{background:rgba(192,72,120,.22);color:#c04878}
    .q-info{flex:1;min-width:0}
    .q-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .q-meta{font-size:10px;color:var(--dm)}
    .q-num{font-size:10px;color:var(--dm);flex-shrink:0}
    .q-rm{background:none;border:none;color:var(--dm);cursor:pointer;font-size:16px;padding:0 2px;transition:color .1s;line-height:1}
    .q-rm:hover{color:var(--r1)}
    .q-action-bar{
      flex-shrink:0;display:none;
      align-items:center;justify-content:center;gap:20px;
      padding:16px;border-top:1px solid var(--br);
      background:rgba(0,0,0,.18);
    }
    .q-act-btn{
      width:48px;height:48px;border-radius:12px;
      border:1px solid var(--br2);background:rgba(255,255,255,.07);
      color:var(--tx);font-size:22px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .12s;font-family:'Roboto Condensed',sans-serif;
    }
    .q-act-btn:disabled{opacity:.2;cursor:default;pointer-events:none}
    .q-act-btn:not(:disabled):hover{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12)}
    .q-act-btn.confirm{background:var(--gd);border-color:var(--g1);color:var(--g1)}
    .q-act-btn.confirm:hover{background:rgba(130,211,74,.22)}
    .q-act-arrows{display:flex;gap:8px}
    .r-user-bar{
      display:flex;flex-wrap:nowrap;gap:5px;padding:8px 12px;
      overflow-x:auto;overflow-y:hidden;
      scrollbar-width:none;border-bottom:1px solid var(--br);
      flex-shrink:0;align-items:center;
    }
    .r-user-bar::-webkit-scrollbar{display:none}
    .r-user-btn{
      flex-shrink:0;padding:5px 13px;border-radius:20px;
      border:1px solid var(--br2);background:rgba(255,255,255,.05);
      color:var(--dm);font-size:11px;font-weight:700;white-space:nowrap;
      cursor:pointer;font-family:'Roboto',sans-serif;transition:all .1s;
    }
    .r-user-btn.active{border-color:var(--g1);background:var(--gd);color:var(--g1)}
    .r-scroll{flex:1;overflow-y:auto}
    .r-slot{
      display:flex;align-items:center;gap:9px;
      padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);
      transition:background .08s;
    }
    .r-slot:nth-child(even){background:rgba(255,255,255,.025)}
    .r-badge{
      width:36px;height:26px;border-radius:7px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;
    }
    .r-badge.F{background:rgba(51,128,204,.28);color:#7AB8F5}
    .r-badge.D{background:rgba(216,157,39,.22);color:#E8B84B}
    .r-badge.G{background:rgba(192,72,120,.22);color:#c04878}
    .r-info{flex:1;min-width:0}
    .r-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .r-meta{font-size:10px;color:var(--dm);margin-top:1px}
    .r-empty{font-size:12px;color:var(--dm)}
    .r-pick-num{font-size:10px;color:var(--dm);flex-shrink:0}

    /* ════════════════════════════════
       MOBILE BOTTOM SHEET
    ════════════════════════════════ */
    .bottom-sheet{
      position:fixed;bottom:0;left:0;right:0;z-index:40;
      display:flex;flex-direction:column;overflow:hidden;
      background:var(--panel-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border-radius:22px 22px 0 0;
      border-top:1px solid rgba(255,255,255,.1);
      box-shadow:0 -8px 40px rgba(0,0,0,.65);
      height:58vh;
    }
    .sheet-grab{
      flex-shrink:0;padding:12px 0 10px;
      display:flex;justify-content:center;cursor:ns-resize;user-select:none;
    }
    .sheet-pip{width:40px;height:4px;background:rgba(255,255,255,.2);border-radius:2px}
    .sheet-tabs{
      flex-shrink:0;display:flex;align-items:flex-end;
      padding:0;gap:0;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .st{
      flex:1;padding:10px 0;font-size:11px;font-weight:700;
      text-transform:uppercase;letter-spacing:.08em;color:var(--dm);
      cursor:pointer;transition:color .12s;border:none;background:none;
      font-family:'Roboto',sans-serif;text-align:center;
      border-bottom:2px solid transparent;margin-bottom:-1px;
    }
    .st.active{color:var(--tx);border-bottom-color:var(--tx)}
    .s-panel{display:none;flex:1;overflow:hidden;flex-direction:column}
    .s-panel.active{display:flex}

    .mob-filter{
      flex-shrink:0;display:flex;gap:6px;padding:12px 12px 10px;
      overflow-x:auto;scrollbar-width:none;align-items:center;
    }
    .mob-filter::-webkit-scrollbar{display:none}
    .mob-scroll{flex:1;overflow-y:auto}
    .mob-row{
      display:flex;align-items:center;gap:9px;
      padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.05);
    }
    .mob-row.drafted{opacity:.3}
    .mob-rank{font-size:11px;color:var(--dm);width:18px;text-align:right;flex-shrink:0}
    .mob-pos{
      width:26px;height:26px;border-radius:7px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;
    }
    .mob-pos.F{background:rgba(51,128,204,.28);color:#7AB8F5}
    .mob-pos.D{background:rgba(216,157,39,.22);color:#E8B84B}
    .mob-pos.G{background:rgba(192,72,120,.22);color:#c04878}
    .mob-info{flex:1;min-width:0}
    .mob-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mob-sub{font-size:10px;color:var(--dm)}
    .mob-adp{font-size:11px;color:var(--dm);flex-shrink:0}
    .mob-q-btn{
      width:28px;height:28px;border-radius:8px;flex-shrink:0;
      background:rgba(255,255,255,.07);border:1px solid var(--br2);
      color:var(--dm);cursor:pointer;font-size:14px;
      display:flex;align-items:center;justify-content:center;transition:all .1s;
    }
    .mob-q-btn.on{background:var(--gd);border-color:var(--g1);color:var(--g1)}
    .mob-draft-btn{
      background:var(--g1);color:var(--p5);border:none;
      border-radius:20px;padding:7px 14px;
      font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;
      cursor:pointer;flex-shrink:0;font-family:'Roboto',sans-serif;min-width:60px;
    }
    .mob-draft-btn:disabled{background:rgba(255,255,255,.15);color:var(--dm);cursor:default}

    @media(min-width:1024px){.bottom-sheet{display:none!important}}
    @media(max-width:1023px){.bottom-card{display:none!important}}
    @media(max-width:1023px){.q-item,.r-slot{padding:17px 14px}}

    ::-webkit-scrollbar{width:3px;height:3px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--br2);border-radius:2px}
  </style>
</head>
<body>

<!-- ═══ BOARD ════════════════════════════════════════════════════════ -->
<div class="board-bg" id="boardBg">
  <div class="board-inner">
    <div class="board-team-row" id="boardTeams"></div>
    <div class="board-rows" id="boardRows"></div>
  </div>
</div>

<!-- ═══ DESKTOP TOPBAR ═══════════════════════════════════════════════ -->
<header class="desk-topbar">
  <div class="dt-left">
    <button class="back-btn">‹</button>
    <span class="draft-name-lbl">2024 NHL '94 Online Draft</span>
  </div>
  <div class="dt-center">
    <button class="start-btn state-setup" id="deskStartBtn" onclick="toggleDraft()">
      <span id="deskStartIcon">▶</span>
      <span id="deskStartLabel">Start Draft</span>
    </button>
  </div>
  <div class="dt-right">
    <div class="demo-row">
      <button class="d-btn" id="dBtnTurn" onclick="toggleMyTurn()">My Turn</button>
      <button class="d-btn on" id="dBtnWait" onclick="toggleMyTurn()">Waiting</button>
      <button class="d-btn" onclick="simPick()">Sim →</button>
    </div>
  </div>
</header>

<!-- ═══ MOBILE TOPBAR ════════════════════════════════════════════════ -->
<div class="mob-topbar" id="mobTopbar">
  <!-- Setup state: single row with Start Draft -->
  <div class="mt-setup" id="mtSetup">
    <div class="mt-row1">
      <button class="mob-back-btn">‹</button>
      <button class="mob-start-btn state-setup" id="mobStartBtn" onclick="startDraft()">▶ Start Draft</button>
      <button class="mob-gear-btn" onclick="openSettings()">⚙</button>
    </div>
  </div>
  <!-- Running/paused state: status pill + team strip -->
  <div class="mt-running" id="mtRunning" style="display:none">
    <div class="mt-row1">
      <button class="mob-back-btn">‹</button>
      <div class="mt-center">
        <div class="mt-status-pill on-clock" id="mtStatusPill">On the Clock</div>
        <div class="mob-timer-val" id="mobTimer">1:23</div>
      </div>
      <button class="mob-gear-btn" onclick="openSettings()">⚙</button>
    </div>
    <div class="mt-team-strip-row">
      <div class="mt-team-strip" id="mtTeamStrip"></div>
    </div>
  </div>
</div>
<!-- Settings sheet -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()"></div>
<div class="settings-sheet" id="settingsSheet">
  <div class="settings-grab" onclick="closeSettings()"><div class="sheet-pip"></div></div>
  <div class="settings-content">
    <button class="settings-action" id="settingsPauseBtn" onclick="toggleDraftFromSettings()">⏸ Pause Draft</button>
  </div>
</div>

<!-- ═══ DESKTOP: BOTTOM CARD ══════════════════════════════════════════ -->
<div class="bottom-card" id="bottomCard">
  <div class="bc-grab" id="bcGrab"><div class="drag-pip"></div></div>
  <div class="bc-body">
    <!-- Players section -->
    <div class="bc-players" id="bcPlayers">
      <div class="player-filter-bar">
        <div class="search-wrap">
          <span class="si">⌕</span>
          <input class="search-input" type="text" placeholder="Find player…" oninput="onSearch(this.value)">
        </div>
        <div class="pos-pills" id="deskPills">
          <button class="pos-pill active" onclick="setPos('ALL',this)"><span class="pp-pos">All</span></button>
          <button class="pos-pill" onclick="setPos('F',this)"><span class="pp-pos">Forwards</span><span class="pp-ct" id="fCt">0/3</span></button>
          <button class="pos-pill" onclick="setPos('D',this)"><span class="pp-pos">Defense</span><span class="pp-ct" id="dCt">0/2</span></button>
          <button class="pos-pill" onclick="setPos('G',this)"><span class="pp-pos">Goalies</span><span class="pp-ct" id="gCt">0/1</span></button>
        </div>
        <label class="show-drafted-lbl">
          <input type="checkbox" id="showDraftedCk"> Show drafted
        </label>
        <button class="bc-hide-btn" id="bcHideBtn" onclick="toggleSidePanel()">Hide ›</button>
      </div>
      <div class="table-scroll">
        <table class="dt">
          <thead id="dtHead"></thead>
          <tbody id="dtBody"></tbody>
        </table>
      </div>
    </div>
    <!-- Vertical resizer handle -->
    <div class="bc-resizer" id="bcResizer"></div>
    <!-- Side panel -->
    <div class="bc-side" id="bcSide">
      <div class="bc-side-header">
        <button class="bc-side-tab active" id="bcTabQueue" onclick="setSideView('queue',this)">Queue</button>
        <button class="bc-side-tab" id="bcTabRoster" onclick="setSideView('roster',this)">Roster</button>
      </div>
      <div class="bc-side-section active" id="bcs-queue">
        <div class="q-auto-row">
          <span class="q-auto-lbl">Auto-pick from queue</span>
          <button class="toggle" onclick="this.classList.toggle('on')"></button>
        </div>
        <div class="q-scroll" id="deskQueueEl"></div>
        <div class="q-action-bar" id="deskQueueActions">
          <button class="q-act-btn confirm" onclick="if(S.selectedQueuePid)selectQueueItem(S.selectedQueuePid)">✓</button>
          <div class="q-act-arrows">
            <button class="q-act-btn act-up" onclick="if(S.selectedQueuePid)moveQ(S.selectedQueuePid,-1)">↑</button>
            <button class="q-act-btn act-dn" onclick="if(S.selectedQueuePid)moveQ(S.selectedQueuePid,1)">↓</button>
          </div>
        </div>
      </div>
      <div class="bc-side-section" id="bcs-roster">
        <div class="r-user-bar" id="deskUserBar"></div>
        <div class="r-scroll" id="deskRosterEl"></div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ MOBILE: BOTTOM SHEET ═════════════════════════════════════════ -->
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-grab" id="sheetGrab"><div class="sheet-pip"></div></div>
  <div class="sheet-tabs">
    <button class="st active" onclick="setMobTab('players',this)">Players</button>
    <button class="st" onclick="setMobTab('queue',this)">Queue</button>
    <button class="st" onclick="setMobTab('team',this)">Rosters</button>
  </div>
  <div class="s-panel active" id="sp-players">
    <div class="mob-filter" id="mobPills">
      <button class="pos-pill active" onclick="setPos('ALL',this,true)"><span class="pp-pos">All</span></button>
      <button class="pos-pill" onclick="setPos('F',this,true)"><span class="pp-pos">Forwards</span><span class="pp-ct" id="mfCt">0/3</span></button>
      <button class="pos-pill" onclick="setPos('D',this,true)"><span class="pp-pos">Defense</span><span class="pp-ct" id="mdCt">0/2</span></button>
      <button class="pos-pill" onclick="setPos('G',this,true)"><span class="pp-pos">Goalies</span><span class="pp-ct" id="mgCt">0/1</span></button>
    </div>
    <div class="mob-scroll" id="mobListEl"></div>
  </div>
  <div class="s-panel" id="sp-queue">
    <div class="q-auto-row">
      <span class="q-auto-lbl">Auto-pick from queue</span>
      <button class="toggle" onclick="this.classList.toggle('on')"></button>
    </div>
    <div class="q-scroll" id="mobQueueEl"></div>
    <div class="q-action-bar" id="mobQueueActions">
      <button class="q-act-btn act-up" onclick="if(S.selectedQueuePid)moveQ(S.selectedQueuePid,-1)">↑</button>
      <button class="q-act-btn confirm" onclick="if(S.selectedQueuePid)selectQueueItem(S.selectedQueuePid)">✓</button>
      <button class="q-act-btn act-dn" onclick="if(S.selectedQueuePid)moveQ(S.selectedQueuePid,1)">↓</button>
    </div>
  </div>
  <div class="s-panel" id="sp-team">
    <div class="r-user-bar" id="mobUserBar"></div>
    <div class="r-scroll" id="mobRosterEl"></div>
  </div>
</div>

<script>
/* ── DATA ─────────────────────────────────────────────────────────── */
const TEAMS=[
  {id:1,name:'BearClaw',   abbr:'BC',mgr:'GrizFan' },
  {id:2,name:'IceDogs',    abbr:'ID',mgr:'Puck44'  },
  {id:3,name:'GreatWhites',abbr:'GW',mgr:'Toews10' },
  {id:4,name:'Team Maple', abbr:'TM',mgr:'IsaacG'  },
  {id:5,name:'NightHawks', abbr:'NH',mgr:'HawkEye' },
  {id:6,name:'WildCards',  abbr:'WC',mgr:'DraftKng'},
  {id:7,name:'PuckStop',   abbr:'PS',mgr:'GoalMkr' },
  {id:8,name:'IceBreakers',abbr:'IB',mgr:'Breaker7'},
];
const MY=4, N=8, NEEDS={F:3,D:2,G:1};
const ROUNDS = NEEDS.F + NEEDS.D + NEEDS.G; // 6 rounds

function teamFor(ov){
  const r=Math.floor((ov-1)/N), p=(ov-1)%N;
  return TEAMS[r%2===0 ? p : N-1-p];
}

const PL=[

/* ── TIMER ────────────────────────────────────────────────────────── */
setInterval(()=>{
  if(!S.timerOn||S.draftState!=='running')return;
  S.timer=Math.max(0,S.timer-1);
  const m=Math.floor(S.timer/60),s=S.timer%60;
  const str=m+':'+String(s).padStart(2,'0');
  const urg=S.timer<=15?' urgent':'';
  const mobT=document.getElementById('mobTimer');
  if(mobT){mobT.textContent=str;mobT.className='mob-timer-val'+urg}
  const ct=document.getElementById('cellTimer');
  if(ct){ct.textContent=str;ct.className='bc-cell-timer'+urg}
  const ctm=document.getElementById('cellTimerMob');
  if(ctm){ctm.textContent=str;ctm.className='bc-mob-cell-timer'+urg}
},1000);

/* ── HELPERS ──────────────────────────────────────────────────────── */
const draftedIds=()=>new Set(picks.map(p=>p.pid));
const myPicks=()=>picks.filter(p=>p.tid===MY).map(p=>({pick:p,pl:PL.find(x=>x.id===p.pid)}));
const myRoster=()=>{const mp=myPicks();return{F:mp.filter(p=>p.pl.pos==='F'),D:mp.filter(p=>p.pl.pos==='D'),G:mp.filter(p=>p.pl.pos==='G')}};
function filtered(){
  const d=draftedIds();
  const sortFns={
    name:p=>`${p.f} ${p.l}`,adp:p=>p.adp,
    spd:p=>p.spd,shp:p=>p.shp,pas:p=>p.pas,dfa:p=>p.dfa,chk:p=>p.chk,agl:p=>p.agl,
  };
  const fn=sortFns[S.sortKey]||sortFns.adp;
  return PL
    .filter(p=>S.posFilter==='ALL'||p.pos===S.posFilter)
    .filter(p=>!S.query||(p.f+' '+p.l).toLowerCase().includes(S.query)||p.t.toLowerCase().includes(S.query))
    .filter(p=>S.showDrafted||!d.has(p.id))
    .sort((a,b)=>{
      const va=fn(a),vb=fn(b);
      const c=typeof va==='string'?va.localeCompare(vb):va-vb;
      return S.sortDir==='asc'?c:-c;
    });
}
function setSort(key){
  S.sortKey===key?S.sortDir=S.sortDir==='asc'?'desc':'asc':(S.sortKey=key,S.sortDir='asc');
  renderDesktop();
}
function sv(v){return`<span class="${v>=5?'sv-hi':v>=3?'sv-md':'sv-lo'}">${v}</span>`}

/* ── RENDER BOARD ─────────────────────────────────────────────────── */
function renderBoard(){
  const teamPickCt=tid=>picks.filter(p=>p.tid===tid).length;
  const curTeam=teamFor(currentOv);
  document.getElementById('boardTeams').innerHTML=
    `<div class="board-rlbl-spacer"></div>`+
    TEAMS.map(t=>{
      const isCur=S.draftState==='running'&&t.id===curTeam.id;
      return`<div class="board-th${t.id===MY?' mine-col':''}">
      <div class="bth-logo${t.id===MY?' mine-logo':''}${isCur?' current':''}">${t.abbr}</div>
      <span class="bth-name${isCur?' bth-name-cur':''}">${t.mgr}</span>
      <span class="bth-picks">${teamPickCt(t.id)}/${ROUNDS}</span>
    </div>`;}).join('');

  let rows='';
  for(let r=1;r<=ROUNDS;r++){
    let cells='';
    for(let i=1;i<=N;i++){
      const ov=(r-1)*N+i, t=teamFor(ov);
      const pick=picks.find(p=>p.ov===ov);
      const pl=pick?PL.find(p=>p.id===pick.pid):null;
      const cur=ov===currentOv;
      const isMine=pick&&pick.tid===MY;
      const isLast=i===N;
      const pnum=`${r}.${i}`;

      const isMyCol=teamFor(ov).id===MY;

      let cls='board-cell';
      if(pl){
        cls+=` pos-${pl.pos}`;
        if(isMine)cls+=' mine';
        if(cur)cls+=' current';
      } else if(cur){
        cls+=' current empty';
      } else {
        cls+=' empty';
        if(isMyCol)cls+=' my-col';
      }

      let deskInner, mobInner;
      if(pl){
        const shortName=`${pl.f.charAt(0)}.${pl.l}`;
        const posAbbv=`${pl.pos} · ${pl.t}`;
        const cardImg=CARD_IDS.has(pl.id)?`../players_cards/${pl.f} ${pl.l}.png`.replace(/ /g,'%20'):'';
        const thumbStyle=cardImg?` style="background-image:url('${cardImg}')"`:''
        deskInner=`
          <div class="bc-posline">${posAbbv}</div>
          <div class="bc-name">${shortName}</div>
          <div class="bc-thumb"${thumbStyle}></div>`;
        mobInner=`
          <div class="bc-mob-top">
            <span class="bc-mob-posline">${posAbbv}</span>
            <span class="bc-mob-pnum">${pnum}</span>
          </div>
          <div class="bc-mob-names">
            <div class="bc-mob-first">${pl.f}</div>
            <div class="bc-mob-last">${pl.l}</div>
          </div>`;
      } else if(cur){
        const clockLbl=S.myTurn?'Your Pick':'On Clock';
        const clockTeam=teamFor(currentOv).mgr;
        const tm=Math.floor(S.timer/60),ts=S.timer%60;
        const timerStr=tm+':'+String(ts).padStart(2,'0');
        const timerUrg=S.timer<=15?' urgent':'';
        deskInner=`
          <div class="bc-clock">${clockLbl}</div>
          <div class="bc-clock-team">${clockTeam}</div>
          <div class="bc-spacer"></div>
          <div class="bc-cell-timer${timerUrg}" id="cellTimer">${timerStr}</div>`;
        mobInner=`
          <div class="bc-mob-top">
            <span class="bc-mob-clock">${clockLbl}</span>
          </div>
          <div class="bc-mob-names">
            <div class="bc-mob-clock-team">${clockTeam}</div>
          </div>`;
      } else {
        deskInner=``;
        mobInner=``;
      }

      cells+=`<div class="${cls}">
        <span class="bc-pnum">${pnum}</span>
        <div class="bc-desk">${deskInner}</div>
        <div class="bc-mob">${mobInner}</div>
      </div>`;
    }
    rows+=`<div class="board-row"><div class="board-rlbl">R${r}</div>${cells}</div>`;
  }
  document.getElementById('boardRows').innerHTML=rows;

  setTimeout(()=>{
    const bg=document.getElementById('boardBg');
    const t=teamFor(currentOv);
    const col=TEAMS.indexOf(t);
    const cw=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cw'))||196;
    const gap=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cgap'))||6;
    const rlblOffset=32+gap; // round label column + gap before first cell
    const leftPad=8;
    bg.scrollLeft=Math.max(0,leftPad+rlblOffset+col*(cw+gap)-bg.clientWidth/2+cw/2);
  },60);
}

/* ── RENDER DESKTOP TABLE ─────────────────────────────────────────── */
function renderDesktop(){
  const d=draftedIds(),pl=filtered(),can=S.myTurn&&S.draftState==='running';
  const th=(key,label,cls='')=>{
    const active=S.sortKey===key;
    const arrow=active?(S.sortDir==='asc'?'▲':'▼'):'';
    return`<th class="sortable${active?' sort-active':''}${cls?' '+cls:''}" onclick="setSort('${key}')">${label}${arrow?`<span class="sort-arrow">${arrow}</span>`:''}`;
  };
  document.getElementById('dtHead').innerHTML=`<tr>
    <th class="col-draft">Draft</th>
    ${th('name','Player','col-player')}
    ${th('adp','ADP')}
    ${th('spd','SPD')}${th('shp','SHP')}${th('pas','PAS')}
    ${th('dfa','DFA')}${th('chk','CHK')}${th('agl','AGL')}
    <th class="col-q">Q</th>
  </tr>`;
  document.getElementById('dtBody').innerHTML=pl.map(p=>{
    const isd=d.has(p.id),inQ=S.queued.has(p.id);
    return`<tr class="${isd?'drafted-row':''}">
      <td class="col-draft"><button class="draft-btn" ${(!can||isd)?'disabled':''} onclick="draft(${p.id})">Draft</button></td>
      <td class="col-player"><div class="td-name-inner">
        <span class="td-name">${p.f} ${p.l}</span>
        <span class="td-sub">${p.pos} · ${p.t} · #${p.jno}${isd?' · Drafted':''}</span>
      </div></td>
      <td>${p.adp.toFixed(1)}</td>
      <td>${sv(p.spd)}</td><td>${sv(p.shp)}</td><td>${sv(p.pas)}</td>
      <td>${sv(p.dfa)}</td><td>${sv(p.chk)}</td><td>${sv(p.agl)}</td>
      <td class="col-q"><button class="q-add-btn${inQ?' on':''}" onclick="toggleQ(${p.id})">${inQ?'✓':'+'}</button></td>
    </tr>`;
  }).join('')||'<tr><td colspan="10" style="padding:20px;text-align:center;color:var(--dm);font-style:italic">No players found</td></tr>';
}

function renderQueue(elId){

      <div class="q-empty-title">Queue is empty</div>
      <div class="q-empty-sub">Tap + on any player to add them to your queue.</div></div>`;return;

  const d=draftedIds();

  el.innerHTML=S.queue.map((pid,idx)=>{
    const p=PL.find(x=>x.id===pid);if(!p)return'';
    const isSel=pid===sel;
    return`<div class="q-item${d.has(pid)?' drafted-row':''}${isSel?' q-selected':''}" onclick="selectQueueItem(${pid})">
      <div class="q-pos ${p.pos}">${p.pos}</div>

        <div class="q-name">${p.f} ${p.l}${d.has(pid)?' (drafted)':''}</div>

      <button class="q-rm" onclick="event.stopPropagation();removeFromQ(${pid})">✕</button>

function renderRosterSlots(elId,tid){
  const el=document.getElementById(elId);if(!el)return;
  const r=tid===MY?myRoster():{F:[],D:[],G:[]};
  const slot=(pos,entry)=>entry
    ?`<div class="r-slot">
        <div class="r-badge ${pos}">${pos}</div>
        <div class="r-info">
          <div class="r-name">${entry.pl.f} ${entry.pl.l}</div>
          <div class="r-meta">${entry.pl.pos} · ${entry.pl.t} · #${entry.pl.jno}</div>
        </div>
        <span class="r-pick-num">R${Math.ceil(entry.pick.ov/N)}.${((entry.pick.ov-1)%N)+1}</span>
      </div>`
    :`<div class="r-slot"><div class="r-badge ${pos}">${pos}</div><span class="r-empty">Empty</span></div>`;
  let html='';
  for(let i=0;i<NEEDS.F;i++)html+=slot('F',r.F[i]);
  for(let i=0;i<NEEDS.D;i++)html+=slot('D',r.D[i]);
  for(let i=0;i<NEEDS.G;i++)html+=slot('G',r.G[i]);
  el.innerHTML=html;
}

/* ── RENDER COUNTS ────────────────────────────────────────────────── */
function renderCounts(){
  const r=myRoster();
  [['f','F'],['d','D'],['g','G']].forEach(([k,pos])=>{
    const s=`${r[pos].length}/${NEEDS[pos]}`;
    document.getElementById(k+'Ct').textContent=s;
    document.getElementById('m'+k+'Ct').textContent=s;
  });
}

/* ── MOBILE TOPBAR ────────────────────────────────────────────────── */
function updateMobTopbar(){
  const isRunning=S.draftState!=='setup';
  document.getElementById('mtSetup').style.display=isRunning?'none':'';
  document.getElementById('mtRunning').style.display=isRunning?'':'none';
  if(window.innerWidth<1024){
    document.getElementById('boardBg').style.top='52px';
  }
  if(isRunning){updateMobStatusPill();renderTeamStrip()}
}
function updateMobStatusPill(){
  const pill=document.getElementById('mtStatusPill');
  if(!pill)return;
  if(S.myTurn){
    pill.textContent='⚡ Your Turn';
    pill.className='mt-status-pill my-turn';
  } else {
    const cur=teamFor(currentOv);
    pill.textContent=cur.mgr+' · On Clock';
    pill.className='mt-status-pill on-clock';
  }
}
function renderTeamStrip(){
  const el=document.getElementById('mtTeamStrip');
  if(!el)return;
  const cur=teamFor(currentOv);
  const ordered=[TEAMS.find(t=>t.id===MY),...TEAMS.filter(t=>t.id!==MY)];
  el.innerHTML=ordered.map(t=>{
    const isCur=t.id===cur.id,isMine=t.id===MY;
    return`<div class="mt-team-chip">
      <div class="mt-chip-logo${isMine?' mine':''}${isCur?' current':''}">${t.abbr}</div>
      <div class="mt-chip-name">${t.mgr}</div>
    </div>`;
  }).join('');
  const curIdx=ordered.findIndex(t=>t.id===cur.id);
  const chips=el.querySelectorAll('.mt-team-chip');
  if(curIdx>=0&&chips[curIdx])chips[curIdx].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

/* ── SETTINGS SHEET ───────────────────────────────────────────────── */
function openSettings(){
  const btn=document.getElementById('settingsPauseBtn');
  btn.textContent=S.draftState==='running'?'⏸ Pause Draft':'▶ Resume Draft';
  document.getElementById('settingsOverlay').classList.add('visible');
  document.getElementById('settingsSheet').classList.add('visible');
}
function closeSettings(){
  document.getElementById('settingsOverlay').classList.remove('visible');
  document.getElementById('settingsSheet').classList.remove('visible');
}
function toggleDraftFromSettings(){
  if(S.draftState==='running')S.draftState='paused';
  else if(S.draftState==='paused')S.draftState='running';
  updateStartBtn();updateMobTopbar();closeSettings();
}

/* ── SIDE VIEW TOGGLE ─────────────────────────────────────────────── */
function setSideView(view,btn){
  document.querySelectorAll('.bc-side-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.bc-side-section').forEach(s=>s.classList.remove('active'));
  document.getElementById('bcs-'+view).classList.add('active');
}
function toggleSidePanel(){
  const side=document.getElementById('bcSide');
  const resizer=document.getElementById('bcResizer');
  const btn=document.getElementById('bcHideBtn');
  const hiding=!side.classList.contains('hidden');
  side.classList.toggle('hidden',hiding);
  resizer.classList.toggle('hidden',hiding);
  btn.textContent=hiding?'‹ Unhide':'Hide ›';
}

/* ── START/PAUSE ──────────────────────────────────────────────────── */
function startDraft(){toggleDraft()}
function toggleDraft(){
  if(S.draftState==='setup')       S.draftState='running';
  else if(S.draftState==='running') S.draftState='paused';
  else                               S.draftState='running';
  updateStartBtn();updateMobTopbar();
}
function updateStartBtn(){
  const labels={setup:'Start Draft',running:'Pause',paused:'Resume'};
  const icons={setup:'▶',running:'⏸',paused:'▶'};
  const btn=document.getElementById('deskStartBtn');
  document.getElementById('deskStartIcon').textContent=icons[S.draftState];
  document.getElementById('deskStartLabel').textContent=labels[S.draftState];
  btn.className=btn.className.replace(/state-\w+/,`state-${S.draftState}`);
}

/* ── INTERACTIONS ─────────────────────────────────────────────────── */
function setPos(pos,btn,isMob){
  S.posFilter=pos;
  const sel=isMob?'#mobPills .pos-pill':'#deskPills .pos-pill';
  document.querySelectorAll(sel).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');renderPlayers();
}
function onSearch(q){S.query=q.toLowerCase();renderPlayers()}
document.getElementById('showDraftedCk').addEventListener('change',e=>{S.showDrafted=e.target.checked;renderPlayers()});

function toggleQ(pid){
  if(S.queued.has(pid)){
    S.queued.delete(pid);S.queue=S.queue.filter(x=>x!==pid);
    if(S.selectedQueuePid===pid)S.selectedQueuePid=null;
  } else{S.queued.add(pid);S.queue.push(pid)}
  renderAll();
}
function removeFromQ(pid){
  S.queued.delete(pid);S.queue=S.queue.filter(x=>x!==pid);
  if(S.selectedQueuePid===pid)S.selectedQueuePid=null;
  renderAll();
}
function selectQueueItem(pid){
  S.selectedQueuePid=S.selectedQueuePid===pid?null:pid;
  renderQueue('deskQueueEl');renderQueue('mobQueueEl');
}
function moveQ(pid,dir){
  const idx=S.queue.indexOf(pid),ni=idx+dir;
  if(ni<0||ni>=S.queue.length)return;
  S.queue.splice(idx,1);S.queue.splice(ni,0,pid);
  renderQueue('deskQueueEl');renderQueue('mobQueueEl');
}
function updateQueueActions(){
  ['deskQueueActions','mobQueueActions'].forEach(id=>{
    const bar=document.getElementById(id);if(!bar)return;
    const pid=S.selectedQueuePid;
    if(!pid){bar.style.display='none';return;}
    bar.style.display='flex';
    const idx=S.queue.indexOf(pid);
    bar.querySelector('.act-up').disabled=idx===0;
    bar.querySelector('.act-dn').disabled=idx===S.queue.length-1;
  });
}

function draft(pid){
  if(!S.myTurn||S.draftState!=='running')return;
  picks.push({ov:currentOv,tid:MY,pid});
  S.queued.delete(pid);S.queue=S.queue.filter(x=>x!==pid);
  currentOv++;S.myTurn=false;S.timer=83;
  document.getElementById('dBtnTurn').classList.remove('on');
  document.getElementById('dBtnWait').classList.add('on');
  renderAll();
}
function toggleMyTurn(){
  S.myTurn=!S.myTurn;
  document.getElementById('dBtnTurn').classList.toggle('on',S.myTurn);
  document.getElementById('dBtnWait').classList.toggle('on',!S.myTurn);
  renderAll();
}
function simPick(){
  const d=draftedIds(),avail=PL.filter(p=>!d.has(p.id)).sort((a,b)=>a.adp-b.adp);
  if(!avail.length)return;
  picks.push({ov:currentOv,tid:teamFor(currentOv).id,pid:avail[0].id});
  currentOv++;S.timer=83;
  S.myTurn=teamFor(currentOv).id===MY;
  document.getElementById('dBtnTurn').classList.toggle('on',S.myTurn);
  document.getElementById('dBtnWait').classList.toggle('on',!S.myTurn);
  renderAll();
}

function setMobTab(tab,btn){
  document.querySelectorAll('.st').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.s-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');document.getElementById('sp-'+tab).classList.add('active');
}

function renderPlayers(){renderDesktop();renderMobile()}
function renderAll(){
  renderBoard();renderPlayers();renderCounts();updateMobTopbar();
  renderQueue('deskQueueEl');renderQueue('mobQueueEl');
  renderUserBar('deskUserBar',viewingTeam);renderUserBar('mobUserBar',viewingTeam);
  renderRosterSlots('deskRosterEl',viewingTeam);renderRosterSlots('mobRosterEl',viewingTeam);
}

/* ── BOTTOM CARD: vertical drag ───────────────────────────────────── */
(function(){
  const handle=document.getElementById('bcGrab');
  const card=document.getElementById('bottomCard');
  if(!handle||!card)return;
  let startY,startH;
  const getY=e=>e.touches?e.touches[0].clientY:e.clientY;
  const onMove=e=>{
    e.preventDefault();
    card.style.height=Math.min(window.innerHeight-52,Math.max(120,startH+(startY-getY(e))))+'px';
  };
  const onEnd=()=>{
    document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onEnd);
    document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);
  };
  const onStart=e=>{
    startY=getY(e);startH=card.offsetHeight;
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);
    document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onEnd);
    e.preventDefault();
  };
  handle.addEventListener('mousedown',onStart);
  handle.addEventListener('touchstart',onStart,{passive:false});
})();

/* ── BOTTOM CARD: horizontal resize ──────────────────────────────── */
(function(){
  const resizer=document.getElementById('bcResizer');
  const side=document.getElementById('bcSide');
  if(!resizer||!side)return;
  let startX,startW;
  const onMove=e=>{
    e.preventDefault();
    const dx=startX-(e.touches?e.touches[0].clientX:e.clientX);
    side.style.width=Math.min(520,Math.max(160,startW+dx))+'px';
    resizer.classList.add('dragging');
  };
  const onEnd=()=>{
    resizer.classList.remove('dragging');
    document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onEnd);
    document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);
  };
  const onStart=e=>{
    startX=e.touches?e.touches[0].clientX:e.clientX;startW=side.offsetWidth;
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);
    document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onEnd);
    e.preventDefault();
  };
  resizer.addEventListener('mousedown',onStart);
  resizer.addEventListener('touchstart',onStart,{passive:false});
})();

/* Sheet grab: drag to resize OR tap to fill/collapse */
(function(){
  const handle=document.getElementById('sheetGrab');
  const panel=document.getElementById('bottomSheet');
  const minH=72;
  const getTopBar=()=>52;
  let startY,startH,moved;
  const getY=e=>e.touches?e.touches[0].clientY:e.clientY;
  const onMove=e=>{
    moved=true;e.preventDefault();
    panel.style.height=Math.min(window.innerHeight-getTopBar(),Math.max(minH,startH+(startY-getY(e))))+'px';
  };
  const onEnd=()=>{
    document.removeEventListener('mousemove',onMove);document.removeEventListener('touchmove',onMove);
    document.removeEventListener('mouseup',onEnd);document.removeEventListener('touchend',onEnd);
    if(!moved){
      const maxH=window.innerHeight-getTopBar();
      panel.style.height=(panel.offsetHeight>=maxH-20?'58vh':maxH+'px');
    }
  };
  const onStart=e=>{
    moved=false;startY=getY(e);startH=panel.offsetHeight;
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);
    document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onEnd);
    e.preventDefault();
  };
  handle.addEventListener('mousedown',onStart);
  handle.addEventListener('touchstart',onStart,{passive:false});
})();

renderAll();
</script>
